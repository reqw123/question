              - generic [ref=f38e78]:
                - text: "PMCID: PMC7132395 PMID:"
                - link "21807418" [ref=f38e79] [cursor=pointer]:
                  - /url: https://pubmed.ncbi.nlm.nih.gov/21807418/
          - region "Article content" [ref=f38e80]:
            - generic [ref=f38e81]:
              - generic [ref=f38e82]:
                - heading "Abstract" [level=2] [ref=f38e83]
                - paragraph [ref=f38e84]: Feline leukemia virus (FeLV) and feline immunodeficiency virus (FIV) are retroviruses with a global impact on the health of domestic cats. The two viruses differ in their potential to cause disease. FIV can cause an acquired immunodeficiency syndrome that increases the risk of developing opportunistic infections, neurological diseases, and tumors. In most naturally infected cats, however, FIV itself does not cause severe clinical signs, and FIV-infected cats may live many years without any health problems. FeLV is more pathogenic, and was long considered to be responsible for more clinical syndromes than any other agent in cats. FeLV can cause tumors (mainly lymphoma), bone marrow suppression syndromes (mainly anemia) and lead to secondary infectious diseases caused by suppressive effects of the virus on bone marrow and the immune system. Today, FeLV is less important as a deadly infectious agent as in the last 20 years prevalence has been decreasing in most countries.
                - paragraph [ref=f38e86]:
                  - strong [ref=f38e87]: "Keywords:"
                  - text: FIV, FeLV, Clinical signs, Tumor, Immunosuppression, Bone marrow suppression
              - separator [ref=f38e88]
              - paragraph [ref=f38e89]:
                - text: Feline immunodeficiency virus (FIV) and feline leukemia virus (FeLV) are among the most common infectious diseases of cats. Belonging to the retroviral family, FIV is classified as a lentivirus, FeLV as a γ-retrovirus. Although FIV and FeLV are both retroviruses, they differ in their potential to cause disease. Vaccines are available for both viruses; however, identification and segregation of infected cats remain the cornerstone for preventing new infections (
                - link "Levy et al., 2008" [ref=f38e90] [cursor=pointer]:
                  - /url: "#bib0455"
                - text: ). In the United States, prevalence of both infections is about 2% in healthy cats and up to about 30% in high-risk or sick cats (
                - link "O’Connor et al., 1991" [ref=f38e91] [cursor=pointer]:
                  - /url: "#bib0590"
                - text: ","
                - link "Levy et al., 2006" [ref=f38e92] [cursor=pointer]:
                  - /url: "#bib0475"
                - text: ). Risk factors for infection include male gender, adulthood, and outdoor access (
                - link "Hoover and Mullins, 1991" [ref=f38e93] [cursor=pointer]:
                  - /url: "#bib0360"
                - text: ","
                - link "Gleich and Hartmann, 2009" [ref=f38e94] [cursor=pointer]:
                  - /url: "#bib0270"
                - text: ). This article provides a comprehensive overview about clinical aspects of FIV and FeLV infection including pathophysiology and immunological background that is intended for both feline practitioners and investigators studying these diseases.
              - generic [ref=f38e95]:
                - heading "1. Feline immunodeficiency virus infection" [level=2] [ref=f38e96]
                - paragraph [ref=f38e97]:
                  - text: FIV can cause an acquired immunodeficiency syndrome in cats, comparable to human immunodeficiency virus (HIV) infection in humans, with increased risk for opportunistic infections, neurologic diseases, and tumors. In a follow-up study in naturally FIV-infected cats, the rate of progression was variable, with death occurring in about 18% of infected cats within the first two years of observation (about five years after the estimated time of infection). An additional 18% developed increasingly severe disease, but more than 50% remained clinically asymptomatic during the two years (
                  - link "Barr, 2000" [ref=f38e98] [cursor=pointer]:
                    - /url: "#bib0035"
                  - text: ). In a closed household of 26 cats, FIV infection did not adversely affect the cats’ life expectancy (
                  - link "Addie et al., 2000" [ref=f38e99] [cursor=pointer]:
                    - /url: "#bib0015"
                  - text: ).
                - paragraph [ref=f38e100]:
                  - text: Experimental FIV infection progresses through several stages, similar to HIV infection in people, including an acute phase, a clinically asymptomatic phase of variable duration, and a terminal phase sometimes named “feline acquired immunodeficiency syndrome” (“FAIDS”) (
                  - link "English, 1995" [ref=f38e101] [cursor=pointer]:
                    - /url: "#bib0195"
                  - text: ","
                  - link "Goto et al., 2000" [ref=f38e102] [cursor=pointer]:
                    - /url: "#bib0275"
                  - text: ). In experimental infection, an initial stage (acute phase) is sometimes noticed with usually transient and mild clinical signs, including fever, lethargy, signs of enteritis, stomatitis, dermatitis, conjunctivitis, respiratory tract disease, and generalized lymph node enlargement (
                  - link "Obert and Hoover, 2000" [ref=f38e103] [cursor=pointer]:
                    - /url: "#bib0595"
                  - text: ). The duration of the following asymptomatic phase varies but usually lasts many years. Factors that influence the length of the asymptomatic stage include the pathogenicity of the infecting isolate (also depending on the FIV subtype), exposure to secondary pathogens, and the age of the cat at the time of infection (
                  - link "Podell et al., 1997" [ref=f38e104] [cursor=pointer]:
                    - /url: "#bib0670"
                  - text: ","
                  - link "Pedersen et al., 2001" [ref=f38e105] [cursor=pointer]:
                    - /url: "#bib0640"
                  - text: ). In the last, symptomatic stage (“FAIDS phase”) of infection, clinical signs are a reflection of opportunistic infections, neoplasia, myelosuppression, and neurologic disease.
                - paragraph [ref=f38e106]:
                  - text: In a survey study of 826 naturally FIV-infected cats examined at North American Veterinary Teaching Hospitals, the most common disease syndromes were stomatitis, neoplasia (especially lymphoma and cutaneous squamous cell carcinoma), ocular inflammation (uveitis and chorioretinitis), anemia and leukopenia, opportunistic infections, renal insufficiency, lower urinary tract disease, and endocrinopathies such as hyperthyroidism and diabetes mellitus (
                  - link "Levy, 2000a" [ref=f38e107] [cursor=pointer]:
                    - /url: "#bib0460"
                  - text: ). Infections with many different “opportunistic” pathogens of viral, bacterial, protozoal, and fungal origin have been reported in FIV-infected cats. Few studies, however, have compared the prevalence of most of these infections in FIV-infected and non-infected cats, and thus, their relevance as true secondary invaders is unclear. Secondary infections are promoted by the immunosuppression caused be FIV through a progressive disruption of normal immune function. The most important immunologic abnormality demonstrated in experimental (
                  - link "Ackley et al., 1990" [ref=f38e108] [cursor=pointer]:
                    - /url: "#bib0010"
                  - text: ","
                  - link "Barlough et al., 1991" [ref=f38e109] [cursor=pointer]:
                    - /url: "#bib0025"
                  - text: ","
                  - link "Tompkins et al., 1991" [ref=f38e110] [cursor=pointer]:
                    - /url: "#bib0850"
                  - text: ) as well as in natural (
                  - link "Novotney et al., 1990" [ref=f38e111] [cursor=pointer]:
                    - /url: "#bib0585"
                  - text: ","
                  - link "Hoffmann-Fezer et al., 1992" [ref=f38e112] [cursor=pointer]:
                    - /url: "#bib0350"
                  - text: ) infection is a decrease in the number and relative proportion of CD4
                  - superscript [ref=f38e113]: +
                  - text: cells in the peripheral blood as well as in most primary lymphoid tissues (
                  - link "Bull et al., 2003" [ref=f38e114] [cursor=pointer]:
                    - /url: "#bib0105"
                  - text: ). Loss of CD4
                  - superscript [ref=f38e115]: +
                  - text: cells leads to inversion of the CD4/CD8 ratio. In addition, an increase in the proportion of CD8
                  - superscript [ref=f38e116]: +
                  - text: cells also contributes to the inversion (
                  - link "Ackley et al., 1990" [ref=f38e117] [cursor=pointer]:
                    - /url: "#bib0010"
                  - text: ","
                  - link "Hoffmann-Fezer et al., 1992" [ref=f38e118] [cursor=pointer]:
                    - /url: "#bib0350"
                  - text: ","
                  - link "Willett et al., 1993" [ref=f38e119] [cursor=pointer]:
                    - /url: "#bib0875"
                  - text: ), in particular a population referred to as “CD8
                  - superscript [ref=f38e120]: +
                  - text: alpha-hi, beta-low cells” (
                  - link "Shimojima et al., 1998" [ref=f38e121] [cursor=pointer]:
                    - /url: "#bib0790"
                  - text: ","
                  - link "Shimojima et al., 2003" [ref=f38e122] [cursor=pointer]:
                    - /url: "#bib0795"
                  - text: ","
                  - link "Phadke et al., 2006" [ref=f38e123] [cursor=pointer]:
                    - /url: "#bib0650"
                  - text: ), a subset of CD8
                  - superscript [ref=f38e124]: +
                  - text: cells that may contribute to suppression of viremia in FIV-infected cats.
                - paragraph [ref=f38e125]:
                  - text: Causes of CD4
                  - superscript [ref=f38e126]: +
                  - text: cell loss include decreased production secondary to bone marrow or thymic infection, lysis of infected cells induced by FIV itself (cytopathic effects), destruction of virus-infected cells by the immune system, or death by apoptosis (cell death that follows receipt of a membrane signal initiating a series of programmed intracellular events) (
                  - link "Bishop et al., 1993" [ref=f38e127] [cursor=pointer]:
                    - /url: "#bib0070"
                  - text: ","
                  - link "Ohno et al., 1993" [ref=f38e128] [cursor=pointer]:
                    - /url: "#bib0600"
                  - text: ","
                  - link "Ohno et al., 1994" [ref=f38e129] [cursor=pointer]:
                    - /url: "#bib0605"
                  - text: ","
                  - link "Johnson et al., 1996" [ref=f38e130] [cursor=pointer]:
                    - /url: "#bib0390"
                  - text: ","
                  - link "Guiot et al., 1997a" [ref=f38e131] [cursor=pointer]:
                    - /url: "#bib0280"
                  - text: ","
                  - link "Guiot et al., 1997b" [ref=f38e132] [cursor=pointer]:
                    - /url: "#bib0285"
                  - text: ","
                  - link "Mizuno et al., 1997" [ref=f38e133] [cursor=pointer]:
                    - /url: "#bib0555"
                  - text: ","
                  - link "Mortola et al., 1998a" [ref=f38e134] [cursor=pointer]:
                    - /url: "#bib0565"
                  - text: ","
                  - link "Mortola et al., 1998b" [ref=f38e135] [cursor=pointer]:
                    - /url: "#bib0570"
                  - text: ","
                  - link "Piedimonte et al., 1999" [ref=f38e136] [cursor=pointer]:
                    - /url: "#bib0665"
                  - text: ","
                  - link "Mizuno et al., 2001" [ref=f38e137] [cursor=pointer]:
                    - /url: "#bib0540"
                  - text: ","
                  - link "Mizuno et al., 2003b" [ref=f38e138] [cursor=pointer]:
                    - /url: "#bib0550"
                  - text: ","
                  - link "Tompkins et al., 2002" [ref=f38e139] [cursor=pointer]:
                    - /url: "#bib0845"
                  - text: ). The degree of apoptosis correlates inversely with CD4
                  - superscript [ref=f38e140]: +
                  - text: numbers and the CD4/CD8 ratio (
                  - link "Holznagel et al., 1998" [ref=f38e141] [cursor=pointer]:
                    - /url: "#bib0355"
                  - text: ). FIV
                  - emphasis [ref=f38e142]: env
                  - text: proteins are capable of inducing apoptosis in mononuclear cells by a mechanism that requires CXCR4 binding (
                  - link "Garg et al., 2004" [ref=f38e143] [cursor=pointer]:
                    - /url: "#bib0265"
                  - text: ). Ultimately, loss of CD4
                  - superscript [ref=f38e144]: +
                  - text: cells impairs immune responses because CD4
                  - superscript [ref=f38e145]: +
                  - text: cells have critical roles in promoting and maintaining both humoral and cell-mediated immunity. A certain subset of CD4
                  - superscript [ref=f38e146]: +
                  - text: cells, termed “Treg” (for T-regulatory cells), also seems to play an important role in FIV immunosuppression, and Treg cells with suppressive activity have been documented during early (
                  - link "Mexas et al., 2008" [ref=f38e147] [cursor=pointer]:
                    - /url: "#bib0525"
                  - text: ) and chronic FIV infection (
                  - link "Petty et al., 2008" [ref=f38e148] [cursor=pointer]:
                    - /url: "#bib0645"
                  - text: ). In FIV-infected cats, increased activity of Treg cells could thus play a role in suppressing immune responses to foreign antigens or pathogens. In addition, Treg cells are themselves targets for FIV infection (
                  - link "Joshi et al., 2005a" [ref=f38e149] [cursor=pointer]:
                    - /url: "#bib0395"
                  - text: ","
                  - link "Joshi et al., 2005b" [ref=f38e150] [cursor=pointer]:
                    - /url: "#bib0400"
                  - text: ","
                  - link "Mexas et al., 2008" [ref=f38e151] [cursor=pointer]:
                    - /url: "#bib0525"
                  - text: ), and may serve as a FIV reservoir during the latent stage of infection capable of stimulating virus production (
                  - link "Joshi et al., 2004" [ref=f38e152] [cursor=pointer]:
                    - /url: "#bib0405"
                  - text: ).
                - paragraph [ref=f38e153]:
                  - text: Several other immunologic abnormalities can be found in FIV-infected cats. Lymphocytes may loose the ability to proliferate in response to stimulation with mitogens or antigens, and priming of lymphocytes by immunogens may be impaired (
                  - link "Hara et al., 1990" [ref=f38e154] [cursor=pointer]:
                    - /url: "#bib0300"
                  - text: ","
                  - link "Hosie and Jarrett, 1990" [ref=f38e155] [cursor=pointer]:
                    - /url: "#bib0370"
                  - text: ","
                  - link "Taniguchi et al., 1990" [ref=f38e156] [cursor=pointer]:
                    - /url: "#bib0820"
                  - text: ","
                  - link "Barlough et al., 1991" [ref=f38e157] [cursor=pointer]:
                    - /url: "#bib0025"
                  - text: ","
                  - link "Taniguchi et al., 1991" [ref=f38e158] [cursor=pointer]:
                    - /url: "#bib0825"
                  - text: ","
                  - link "Torten et al., 1991" [ref=f38e159] [cursor=pointer]:
                    - /url: "#bib0855"
                  - text: ","
                  - link "Bishop et al., 1992a" [ref=f38e160] [cursor=pointer]:
                    - /url: "#bib0075"
                  - text: ","
                  - link "Bishop et al., 1992b" [ref=f38e161] [cursor=pointer]:
                    - /url: "#bib0080"
                  - text: ). Lymphocyte function may be reduced by altered expression of cell surface molecules, such as CD4, major histocompatibility complex II antigens, or cytokines and cytokine receptors (
                  - link "Willett et al., 1991" [ref=f38e162] [cursor=pointer]:
                    - /url: "#bib0880"
                  - text: ","
                  - link "Ohno et al., 1992" [ref=f38e163] [cursor=pointer]:
                    - /url: "#bib0610"
                  - text: ","
                  - link "Rideout et al., 1992" [ref=f38e164] [cursor=pointer]:
                    - /url: "#bib0735"
                  - text: ","
                  - link "Choi et al., 2000" [ref=f38e165] [cursor=pointer]:
                    - /url: "#bib0130"
                  - text: ","
                  - link "Mizuno et al., 2003a" [ref=f38e166] [cursor=pointer]:
                    - /url: "#bib0545"
                  - text: ), or through over-expression of abnormal molecules, such as receptors (
                  - link "Nishimura et al., 2004" [ref=f38e167] [cursor=pointer]:
                    - /url: "#bib0580"
                  - text: ), leading to disrupted cytokines production or receptor function. Impaired neutrophil adhesion and emigration in response to bacterial products have been described in FIV-infected cats (
                  - link "Hanlon et al., 1993" [ref=f38e168] [cursor=pointer]:
                    - /url: "#bib0295"
                  - text: ","
                  - link "Kubes et al., 2003" [ref=f38e169] [cursor=pointer]:
                    - /url: "#bib0435"
                  - text: ","
                  - link "Heit et al., 2006" [ref=f38e170] [cursor=pointer]:
                    - /url: "#bib0335"
                  - text: ). Natural killer cell activity may be diminished (
                  - link "Zaccaro et al., 1995" [ref=f38e171] [cursor=pointer]:
                    - /url: "#bib0885"
                  - text: ) or increased (
                  - link "Zhao et al., 1995" [ref=f38e172] [cursor=pointer]:
                    - /url: "#bib0890"
                  - text: ) in acutely or asymptomatically infected cats, respectively. Changes in cytokine patterns include increased production of interferon (IFN)-γ, tumor necrosis factor (TNF)-α, IL-4, IL-6, IL-10, and IL-12 (
                  - link "Lerner et al., 1998" [ref=f38e173] [cursor=pointer]:
                    - /url: "#bib0450"
                  - text: ","
                  - link "Liang et al., 2000" [ref=f38e174] [cursor=pointer]:
                    - /url: "#bib0480"
                  - text: ","
                  - link "Orandle et al., 2000" [ref=f38e175] [cursor=pointer]:
                    - /url: "#bib0615"
                  - text: ","
                  - link "Ritchey et al., 2001" [ref=f38e176] [cursor=pointer]:
                    - /url: "#bib0740"
                  - text: ), but also differences in cytokine ratios (e.g., IL-10/IL-12 ratio) (
                  - link "Dean et al., 1998" [ref=f38e177] [cursor=pointer]:
                    - /url: "#bib0165"
                  - text: ","
                  - link "Lehman et al., 2009" [ref=f38e178] [cursor=pointer]:
                    - /url: "#bib0445"
                  - text: ).
                - paragraph [ref=f38e179]:
                  - text: Another immunologic dysregulation observed in many FIV-infected cats is an excessive immune response leading to hypergammaglobulinemia (
                  - link "Ackley et al., 1990" [ref=f38e180] [cursor=pointer]:
                    - /url: "#bib0010"
                  - text: ","
                  - link "Flynn et al., 1994" [ref=f38e181] [cursor=pointer]:
                    - /url: "#bib0225"
                  - text: ","
                  - link "Gleich and Hartmann, 2009" [ref=f38e182] [cursor=pointer]:
                    - /url: "#bib0270"
                  - text: ). Hypergammaglobulinemia reflects polyclonal B-cell stimulation and is a direct consequence of FIV infection, because healthy FIV-positive, specific pathogen-free (SPF) cats also develop hypergammaglobulinemia (
                  - link "Flynn et al., 1994" [ref=f38e183] [cursor=pointer]:
                    - /url: "#bib0225"
                  - text: ). In addition to increased IgG, increased circulating immune complexes have been detected in FIV-infected cats (
                  - link "Matsumoto et al., 1997" [ref=f38e184] [cursor=pointer]:
                    - /url: "#bib0505"
                  - text: ), potentially leading to immune complex deposition disorders, such as glomerulonephritis and uveitis.
                - paragraph [ref=f38e185]:
                  - text: Chronic ulcero-proliferative stomatitis is the most common syndrome found in cats naturally infected with FIV (affecting up to 50%). It characteristically originates in the pharyngeal area and spreads rostrally, especially along the maxillary teeth. Lesions are often painful, and tooth loss is common. Severe stomatitis can lead to anorexia and emaciation. Histologically, the mucosa is invaded by plasma cells and lymphocytes, accompanied by variable degrees of neutrophilic and eosinophilic inflammation. The cause of this syndrome is uncertain, but the histologic findings suggest an immune response to chronic antigenic stimulation or immune dysregulation. Circulating lymphocytes of cats with stomatitis have greater than normal expression of inflammatory cytokines (
                  - link "Levy, 2000a" [ref=f38e186] [cursor=pointer]:
                    - /url: "#bib0460"
                  - text: ), further implicating immune activation in the pathogenesis of this condition. This type of stomatitis is not always correlated with FIV infection (
                  - link "Quimby et al., 2008" [ref=f38e187] [cursor=pointer]:
                    - /url: "#bib0715"
                  - text: ), and is usually not seen in experimentally FIV-infected specific pathogen-free cats, suggesting that exposure to other infectious agents also plays a role (
                  - link "Levy, 2000b" [ref=f38e188] [cursor=pointer]:
                    - /url: "#bib0465"
                  - text: ). Concurrent feline calicivirus (FCV) infection is often identified in the oral cavity of these cats, and experimental and naturally occurring co-infection of FIV-infected cats with FCV results in more severe disease (
                  - link "Tenorio et al., 1991" [ref=f38e189] [cursor=pointer]:
                    - /url: "#bib0830"
                  - text: ","
                  - link "Reubel et al., 1994" [ref=f38e190] [cursor=pointer]:
                    - /url: "#bib0725"
                  - text: ).
                - paragraph [ref=f38e191]:
                  - text: Neurologic signs have been described in both natural and experimental in acute as well as chronic FIV infections (
                  - link "Dow et al., 1990" [ref=f38e192] [cursor=pointer]:
                    - /url: "#bib0180"
                  - text: ","
                  - link "Dow et al., 1992" [ref=f38e193] [cursor=pointer]:
                    - /url: "#bib0175"
                  - text: ","
                  - link "Podell et al., 1993" [ref=f38e194] [cursor=pointer]:
                    - /url: "#bib0680"
                  - text: ","
                  - link "English et al., 1994" [ref=f38e195] [cursor=pointer]:
                    - /url: "#bib0200"
                  - text: ","
                  - link "Phillips et al., 1994" [ref=f38e196] [cursor=pointer]:
                    - /url: "#bib0655"
                  - text: ","
                  - link "Abramo et al., 1995" [ref=f38e197] [cursor=pointer]:
                    - /url: "#bib0005"
                  - text: ). About 5% of clinically affected FIV-infected cats have a neurological disease as a predominant clinical feature. Neurologic disorders in FIV infection seem to be strain-dependent (
                  - link "Power et al., 1998" [ref=f38e198] [cursor=pointer]:
                    - /url: "#bib0695"
                  - text: ). Both central and peripheral neurologic manifestations are seen, comparable to the changes in HIV-infected human beings. Dementia in human patients with AIDS is often characterized by a slight decline in cognitive ability or behavior, changes that may be too subtle to recognize in cats. Neurological abnormalities seen in naturally infected cats also tend to be more behavioral than motor. Twitching movements of the face and tongue, psychotic behavior, compulsive roaming, dementia, loss of bladder and rectal control, and disturbed sleep patterns have been obeserved. Other signs described include nystagmus, ataxia, seizures, and intention tremors (
                  - link "Prospero-Garcia et al., 1994" [ref=f38e199] [cursor=pointer]:
                    - /url: "#bib0705"
                  - text: ","
                  - link "Gunn-Moore et al., 1996" [ref=f38e200] [cursor=pointer]:
                    - /url: "#bib0290"
                  - text: ","
                  - link "Steigerwald et al., 1999" [ref=f38e201] [cursor=pointer]:
                    - /url: "#bib0800"
                  - text: ). Abnormal forebrain electrical activity and abnormal visual and auditory-evoked potentials have also been documented in cats that appeared otherwise normal (
                  - link "Podell et al., 1997" [ref=f38e202] [cursor=pointer]:
                    - /url: "#bib0670"
                  - text: ","
                  - link "Podell et al., 1999" [ref=f38e203] [cursor=pointer]:
                    - /url: "#bib0675"
                  - text: ","
                  - link "Barr et al., 2000" [ref=f38e204] [cursor=pointer]:
                    - /url: "#bib0040"
                  - text: ","
                  - link "Phipps et al., 2000" [ref=f38e205] [cursor=pointer]:
                    - /url: "#bib0660"
                  - text: ). Although the majority of FIV-infected cats do not show clinically observable neurologic signs, a much higher proportion of infected cats exhibit microscopic CNS lesions. Brain lesions may occur in the absence of massive infection, and abnormal neurological function has been documented in FIV-infected cats with only mild to moderate histological evidence of inflammation (
                  - link "Barr, 2000" [ref=f38e206] [cursor=pointer]:
                    - /url: "#bib0035"
                  - text: ). Pathologic findings include the presence of perivascular infiltrates of mononuclear cells, diffuse gliosis, glial nodules, and white matter pallor. These lesions are usually located in the caudate nucleus, midbrain, and rostral brain stem (
                  - link "Barr, 2000" [ref=f38e207] [cursor=pointer]:
                    - /url: "#bib0035"
                  - text: ).
                - paragraph [ref=f38e208]:
                  - text: FIV enters the brain early following experimental infection, most likely
                  - emphasis [ref=f38e209]: via
                  - text: the blood–brain and blood–cerebrospinal fluid barriers. The exact mechanism of entry, and the factors that influence this entry, are not fully understood (
                  - link "Fletcher et al., 2010" [ref=f38e210] [cursor=pointer]:
                    - /url: "#bib0220"
                  - text: ). Tumor necrosis factor (TNF)-alpha seems to play an important role in lymphocyte migration through the blood–brain barrier (
                  - link "Fletcher et al., 2010" [ref=f38e211] [cursor=pointer]:
                    - /url: "#bib0220"
                  - text: ). Caused by the early brain infection, virus-induced CNS lesions sometimes develop within two months of experimental infection (
                  - link "Barr, 2000" [ref=f38e212] [cursor=pointer]:
                    - /url: "#bib0035"
                  - text: ). Microglia and astrocytes are infected by FIV. The virus does not infect neurons. However, neuronal death has been associated with FIV infection; in particular, forebrain signs are often a result of direct neuronal injury from the virus. Neurologic expression of FIV infection is highly strain-dependent. The FIV envelope seems to be a principal determinant of neuropathogenesis because the envelope, which is a domain of extensive molecular diversity, directly influences neuropathogenesis through the activation of select proteases (
                  - link "Power et al., 2004" [ref=f38e213] [cursor=pointer]:
                    - /url: "#bib0700"
                  - text: ). However, while envelope proteins of some FIV strains can promote neuronal swelling and death, envelope proteins of other strains have negligible toxicity (
                  - link "Bragg et al., 1999" [ref=f38e214] [cursor=pointer]:
                    - /url: "#bib0090"
                  - text: ).
                - paragraph [ref=f38e215]:
                  - text: The exact mechanism of neuronal damage by FIV is unclear but may include neuronal apoptosis, effects on the neuron supportive functions of astroytes, toxic products released from infected microglia, or cytokines produced in response to viral infection.
                  - emphasis [ref=f38e216]: In vitro
                  - text: studies support the hypothesis that FIV infection may impair normal metabolism in CNS cells, particularly astrocytes (
                  - link "Barr, 2000" [ref=f38e217] [cursor=pointer]:
                    - /url: "#bib0035"
                  - text: ). Documented abnormalities of astrocyte function include altered intercellular communication, abnormal glutathione reductase activity that could render cells more susceptible to oxidative injury, and alterations in mitochondrial membrane potential that disrupt energy-producing capacities of the cell (
                  - link "Sellon, 1998" [ref=f38e218] [cursor=pointer]:
                    - /url: "#bib0770"
                  - text: ). Astrocytes are by far the most common cell type of the brain and are important in maintaining CNS neuronal mirovascular microenvironment. One of the most important functions of astrocyes is to regulate the level of extracellular glutamate, a major excitatory neurotransmitter that accumulates as a consequence of neuronal activity. Excessive extracellular glutamate often results in neuronal toxicity and death. FIV infection of feline astrocytes can significantly inhibit their glutamate-scavenging ability, potentially resulting in neuronal damage (
                  - link "Sellon, 1998" [ref=f38e219] [cursor=pointer]:
                    - /url: "#bib0770"
                  - text: ", 2002;"
                  - link "Sellon and Hartmann, 2006" [ref=f38e220] [cursor=pointer]:
                    - /url: "#bib0765"
                  - text: ). Intracellular calcium levels seem to play a critical role, and changes in its levels may lead to neuronal dysfunction (
                  - link "Meeker, 2007" [ref=f38e221] [cursor=pointer]:
                    - /url: "#bib0520"
                  - text: ). It has been shown that choroid plexus macrophages proliferate and release toxic factors in response to FIV (
                  - link "Bragg et al., 2002" [ref=f38e222] [cursor=pointer]:
                    - /url: "#bib0085"
                  - text: ), and that these factors destabilize neuronal calcium homeostasis (
                  - link "Bragg et al., 2002" [ref=f38e223] [cursor=pointer]:
                    - /url: "#bib0085"
                  - text: ). Thus, choroid plexus macrophages may contribute to an inflammatory cascade in the brain that progresses independently of systemic and CSF viral load.
                - paragraph [ref=f38e224]:
                  - text: CSF changes described in FIV-infected cats with neurologic disease include cellular pleocytosis and increases in concentrations of IgG (
                  - link "Dow et al., 1990" [ref=f38e225] [cursor=pointer]:
                    - /url: "#bib0180"
                  - text: ). Viral RNA may be detected in the CSF of some cats and suggests parenchymal infection (
                  - link "Ryan et al., 2003" [ref=f38e226] [cursor=pointer]:
                    - /url: "#bib0755"
                  - text: ).
                - paragraph [ref=f38e227]:
                  - text: FIV-infected cats are about five times more likely to develop lymphoma or leukemia than non-infected cats and have a higher incidence of certain types of tumors (
                  - link "Poli et al., 1994" [ref=f38e228] [cursor=pointer]:
                    - /url: "#bib0685"
                  - text: ","
                  - link "Callanan et al., 1996" [ref=f38e229] [cursor=pointer]:
                    - /url: "#bib0115"
                  - text: ). Lymphomas (mostly B-cell lymphomas) (
                  - link "Poli et al., 1994" [ref=f38e230] [cursor=pointer]:
                    - /url: "#bib0685"
                  - text: ","
                  - link "Terry et al., 1995" [ref=f38e231] [cursor=pointer]:
                    - /url: "#bib0835"
                  - text: ","
                  - link "Callanan et al., 1996" [ref=f38e232] [cursor=pointer]:
                    - /url: "#bib0115"
                  - text: ","
                  - link "Gabor et al., 2001" [ref=f38e233] [cursor=pointer]:
                    - /url: "#bib0260"
                  - text: ), leukemias, and a variety of other tumors have been described in association with FIV infection (
                  - link "Fleming et al., 1991" [ref=f38e234] [cursor=pointer]:
                    - /url: "#bib0215"
                  - text: ","
                  - link "Hutson et al., 1991" [ref=f38e235] [cursor=pointer]:
                    - /url: "#bib0375"
                  - text: ","
                  - link "Buracco et al., 1992" [ref=f38e236] [cursor=pointer]:
                    - /url: "#bib0110"
                  - text: ","
                  - link "Callanan et al., 1992" [ref=f38e237] [cursor=pointer]:
                    - /url: "#bib0120"
                  - text: ","
                  - link "Poli et al., 1994" [ref=f38e238] [cursor=pointer]:
                    - /url: "#bib0685"
                  - text: ","
                  - link "Court et al., 1997" [ref=f38e239] [cursor=pointer]:
                    - /url: "#bib0150"
                  - text: ","
                  - link "Barr et al., 2000" [ref=f38e240] [cursor=pointer]:
                    - /url: "#bib0040"
                  - text: ), including squamous cell carcinoma, fibrosarcoma, and mast cell tumor. FIV provirus, however, is only occasionally detected in tumor cells (
                  - link "Beatty et al., 1998a" [ref=f38e241] [cursor=pointer]:
                    - /url: "#bib0050"
                  - text: ","
                  - link "Beatty et al., 1998b" [ref=f38e242] [cursor=pointer]:
                    - /url: "#bib0055"
                  - text: ","
                  - link "Beatty et al., 2002" [ref=f38e243] [cursor=pointer]:
                    - /url: "#bib0045"
                  - text: ","
                  - link "Wang et al., 2001" [ref=f38e244] [cursor=pointer]:
                    - /url: "#bib0870"
                  - text: ) suggesting a more indirect role in lymphoma formation, such as decreased cell-mediated immune surveillance or chronic B-cell hyperplasia (
                  - link "Endo et al., 1997" [ref=f38e245] [cursor=pointer]:
                    - /url: "#bib0190"
                  - text: ","
                  - link "Beatty et al., 1998b" [ref=f38e246] [cursor=pointer]:
                    - /url: "#bib0055"
                  - text: ). However, clonally integrated FIV DNA was found in lymphoma cells from one cat that had been experimentally infected six years earlier (
                  - link "Diehl and Hoover, 1992" [ref=f38e247] [cursor=pointer]:
                    - /url: "#bib0170"
                  - text: ","
                  - link "Beatty et al., 1998a" [ref=f38e248] [cursor=pointer]:
                    - /url: "#bib0050"
                  - text: ","
                  - link "Beatty et al., 2002" [ref=f38e249] [cursor=pointer]:
                    - /url: "#bib0045"
                  - text: ) indicating the possibility of an occasional direct oncogenic role of FIV in some animals. The prevalence of FIV infection in one cohort of cats with lymphoma was 50% (
                  - link "Gabor et al., 2001" [ref=f38e250] [cursor=pointer]:
                    - /url: "#bib0260"
                  - text: ), much higher than the FIV prevalence in the population of cats without lymphomas, which is also supportive of a cause and effect relationship. Beside causing a direct effect, FIV may alternatively increase cancer incidence by decreasing tumor immunosurveillance mechanisms, may promote tumor development through the immunostimulatory effects of replicating in lymphocytes, or may impair immunological control of FeLV infection and accelerate the proliferation of transformed lymphoid cells.
              - generic [ref=f38e251]:
                - heading "2. Feline leukemia virus infection" [level=2] [ref=f38e252]
                - paragraph [ref=f38e253]:
                  - text: FeLV is more pathogenic than FIV. Historically, FeLV was considered to account for most disease-related deaths and to be responsible for more clinical syndromes than any other single agent in cats. It was proposed that approximately one-third of all tumor-related deaths in cats were caused by FeLV, and an even greater number of cats died of FeLV-related anemia and secondary infectious diseases caused by suppressive effects of the virus on bone marrow and the immune system. Today, these statements have to be revised, as in recent years prevalence and consequently importance of FeLV as a pathogen in cats have been decreasing. Still, if present in closed households with endemic feline coronavirus (FCoV), FeLV, FIV, or all of these infections, FeLV infection has the greatest impact on mortality (
                  - link "Addie et al., 2000" [ref=f38e254] [cursor=pointer]:
                    - /url: "#bib0015"
                  - text: ). The death rate of progressively FeLV-infected cats in multi-cat households is approximately 50% in two years and 80% in three years (
                  - link "Cotter, 1998" [ref=f38e255] [cursor=pointer]:
                    - /url: "#bib0140"
                  - text: ","
                  - link "Levy, 2000c" [ref=f38e256] [cursor=pointer]:
                    - /url: "#bib0470"
                  - text: ), but much lower for cats kept strictly indoors in single-cat households. A large study in the United States compared the survival of more than 1000 FeLV-infected cats to more than 8000 age- and sex-matched uninfected control cats and found that in FeLV-infected cats median survival was 2.4 years compared to 6.0 years for control cats (
                  - link "Levy et al., 2006" [ref=f38e257] [cursor=pointer]:
                    - /url: "#bib0475"
                  - text: ).
                - paragraph [ref=f38e258]:
                  - text: Clinical signs associated with FeLV infection are variable. Although the virus was named after the contagious tumor that first garnered its attention, most infected cats are presented to the veterinarian not for tumors but for anemia or immunosuppression. Of 8642 FeLV-infected cats examined at North American Veterinary Teaching Hospitals, various co-infections (including FIV infection, FIP, upper respiratory infection, hemotropic mycoplasmosis, and stomatitis) were the most frequent findings (15%), followed by anemia (11%), lymphoma (6%), leukopenia or thrombocytopenia (5%), and leukemia or myeloproliferative disease (4%) (
                  - link "Cotter, 1991" [ref=f38e259] [cursor=pointer]:
                    - /url: "#bib0135"
                  - text: ). The exact mechanisms for the different clinical responses in progressively FeLV-infected cats are poorly understood. It is clear that the clinical course is determined by a combination of viral and host factors. Some of these differences can be traced to properties of the virus itself, such as the subgroup that determines differences in the clinical picture (e.g., FeLV-B is primarily associated with tumors, FeLV-C is primarily associated with non-regenerative anemia).
                - paragraph [ref=f38e260]:
                  - link "Flynn et al. (2002)" [ref=f38e261] [cursor=pointer]:
                    - /url: "#bib0230"
                  - text: examined dominant host immune effector mechanisms responsible for the outcome of infection by using longitudinal changes in FeLV-specific cytotoxic T-lymphocytes (CTL). High levels of circulating FeLV-specific effector CTLs appear before virus-neutralizing antibodies in cats that have recovered from exposure to FeLV. In contrast, progressive infection with persistent viremia has been associated with a silencing of virus-specific humoral and cell-mediated immunity host effector mechanisms (
                  - link "Flynn et al., 2002" [ref=f38e262] [cursor=pointer]:
                    - /url: "#bib0230"
                  - text: ). It is likely that the most important host factor that determines the clinical outcome of cats infected with FeLV is the age of the cat at the time of infection (
                  - link "Hoover et al., 1976" [ref=f38e263] [cursor=pointer]:
                    - /url: "#bib0365"
                  - text: ). Neonatal kittens develop marked thymic atrophy after infection (“fading kitten syndrome”), resulting in severe immunosuppression, wasting, and early death. As cats mature, they acquire a progressive resistance. When older cats become infected, they tend to have abortive or regressive infections or, if developing progressive infection, have at least milder signs and a more protracted period of apparent good health (
                  - link "Levy, 2000c" [ref=f38e264] [cursor=pointer]:
                    - /url: "#bib0470"
                  - text: ).
                - paragraph [ref=f38e265]:
                  - text: Clinical signs associated with FeLV infection can be classified as tumors, immunosuppression, hematologic disorders, immune-mediated diseases, and other syndromes (including neuropathy, reproductive disorders, fading kitten syndrome). Immunosuppression is caused by various mechanisms in FeLV-infected cats. It has been occasionally associated with un-integrated viral DNA from replication-defective viral variants (
                  - link "Overbaugh et al., 1988" [ref=f38e266] [cursor=pointer]:
                    - /url: "#bib0620"
                  - text: ). These pathogenic immunosuppressive variants, such as FeLV-T, require a membrane-spanning receptor molecule (Pit1) and a second co-receptor protein (FeLIX) to infect T lymphocytes (
                  - link "Lauring et al., 2002" [ref=f38e267] [cursor=pointer]:
                    - /url: "#bib0440"
                  - text: ). The latter protein is an endogenously expressed protein, which is similar to the FeLV receptor-binding protein of FeLV-B (
                  - link "Barnett et al., 2003" [ref=f38e268] [cursor=pointer]:
                    - /url: "#bib0030"
                  - text: ).
                - paragraph [ref=f38e269]:
                  - text: Affected cats may develop thymic atrophy and depletion of lymph node paracortical zones following infection. Lymphopenia and neutropenia are common. In addition, neutrophils of progressively infected cats have decreased chemotactic and phagocytic function compared with those of normal cats. In some cats, lymphopenia may be characterized by preferential loss of CD4
                  - superscript [ref=f38e270]: +
                  - text: helper T cells, resulting in an inverted CD4/CD8 ratio (like typically seen in FIV infection) (
                  - link "Quackenbush et al., 1990" [ref=f38e271] [cursor=pointer]:
                    - /url: "#bib0710"
                  - text: ","
                  - link "Hoffmann-Fezer et al., 1996" [ref=f38e272] [cursor=pointer]:
                    - /url: "#bib0345"
                  - text: ), but more commonly, substantial losses of helper cells and cytotoxic suppressor cells (CD8
                  - superscript [ref=f38e273]: +
                  - text: cells) occur (
                  - link "Hoffmann-Fezer et al., 1996" [ref=f38e274] [cursor=pointer]:
                    - /url: "#bib0345"
                  - text: ). Many immune function tests of naturally FeLV-infected cats are abnormal, including decreased response to T-cell mitogens, prolonged allograft reaction, reduced immunoglobulin production, depressed neutrophil function, and complement depletion. IL-2 and IL-4 are decreased in some cats (
                  - link "Linenberger and Deng, 1999" [ref=f38e275] [cursor=pointer]:
                    - /url: "#bib0485"
                  - text: ","
                  - link "Levy, 2000c" [ref=f38e276] [cursor=pointer]:
                    - /url: "#bib0470"
                  - text: ), but FeLV does not appear to suppress IL-1 production from infected macrophages. IFN-γ may be deficient or increased. Increased TNF-α has been observed in serum of infected cats and in infected cells in culture. Each cytokine plays a vital role in the generation of a normal immune response, and the excess production of certain cytokines such as TNF-α can also cause illness. T-cells of FeLV-infected cats produce significantly lower levels of B-cell stimulatory factors than do those of normal cats (this defect becomes progressively more severe over time) (
                  - link "Diehl and Hoover, 1992" [ref=f38e277] [cursor=pointer]:
                    - /url: "#bib0170"
                  - text: ), but when B-cells of FeLV-infected cats are stimulated
                  - emphasis [ref=f38e278]: in vitro
                  - text: by uninfected T-cells, their function remains normal. In vaccination studies, FeLV-infected cats have not been able to mount an adequate immune response to vaccines, such as rabies. Therefore, protection in a FeLV-infected cat after vaccination is not complete and comparable to that in a healthy cat, and more frequent vaccinations (e.g., every six months) have to be considered (
                  - link "Lutz et al., 2009" [ref=f38e279] [cursor=pointer]:
                    - /url: "#bib0495"
                  - text: ).
                - paragraph [ref=f38e280]:
                  - text: In addition to immunosuppression, FeLV-infected cats can develop immune-mediated diseases caused by an overactive or dysregulated immune response to the virus. Although humoral immunity to specific stimulation decreases, nonspecific increases of IgG and IgM have been noted. The loss of T-cell activity and the formation of antigen antibody complexes promote the immune dysregulation (
                  - link "Pedersen, 1988" [ref=f38e281] [cursor=pointer]:
                    - /url: "#bib0625"
                  - text: ). Immune-mediated diseases described in FeLV-infected cats include AIHA (
                  - link "Kohn et al., 2006" [ref=f38e282] [cursor=pointer]:
                    - /url: "#bib0425"
                  - text: ), glomerulonephritis (
                  - link "Anderson and Jarrett, 1971" [ref=f38e283] [cursor=pointer]:
                    - /url: "#bib0020"
                  - text: ), uveitis with immune complex deposition in iris and ciliary body (
                  - link "Brightman et al., 1991" [ref=f38e284] [cursor=pointer]:
                    - /url: "#bib0095"
                  - text: ), and polyarthritis (
                  - link "Pedersen, 1991" [ref=f38e285] [cursor=pointer]:
                    - /url: "#bib0630"
                  - text: ). Chronic progressive polyarthritis can be triggered by FeLV; in about 20% of cats with polyarthritis, FeLV seems to be an associated agent (
                  - link "Pedersen, 1991" [ref=f38e286] [cursor=pointer]:
                    - /url: "#bib0630"
                  - text: ). Cats with glomerulonephritis have more circulating FeLV antigen that do other FeLV-infected cats. However, in a recent study FeLV-infected cats in general did not show significantly more commonly hypergammaglobulinemia in plasma electrophoretogram in contrast to FIV-infected cats (
                  - link "Miro et al., 2007" [ref=f38e287] [cursor=pointer]:
                    - /url: "#bib0530"
                  - text: ), and hyperproteinemia is not a common problem in FeLV-infected cats (in contrast to FIV infection) (
                  - link "Gleich and Hartmann, 2009" [ref=f38e288] [cursor=pointer]:
                    - /url: "#bib0270"
                  - text: ). Antigens that can lead to antigen antibody complex formation include not only whole virus particles but also free gp70, p27, or p15E proteins (
                  - link "Day et al., 1980" [ref=f38e289] [cursor=pointer]:
                    - /url: "#bib0160"
                  - text: ","
                  - link "Tuomari et al., 1984" [ref=f38e290] [cursor=pointer]:
                    - /url: "#bib0865"
                  - text: ).
                - paragraph [ref=f38e291]:
                  - text: Hematopoietic disorders, particularly cytopenias caused by bone marrow suppression, are a common finding in FeLV-infected cats. Hematologic disorders described in association with FeLV include anemia (non-regenerative or regenerative), persistent, transient, or cyclic neutropenia, platelet abnormalities (thrombocytopenia and platelet function abnormalities), aplastic anemia (pancytopenia), and panleukopenia-like syndrome. For the majority of pathogenic mechanisms in which FeLV causes bone marrow suppression, active virus replication is required. However, it has been demonstrated that in some FeLV antigen-negative cats, regressive FeLV infection without viremia may be responsible for bone marrow suppression. In a recent study including 37 cats with myelosuppression that had tested FeLV antigen-negative in peripheral blood, 2/37 cats (5%) were found regressively infected with FeLV by bone marrow PCR (both had non-regenerative anemia) (
                  - link "Stützer et al., 2010" [ref=f38e292] [cursor=pointer]:
                    - /url: "#bib0810"
                  - text: ). In these cats, FeLV provirus may interrupt or inactivate cellular genes in the infected cells, or regulatory features of viral DNA may alter expression of neighboring genes. Additionally, cell function of provirus-containing myelomonocytic progenitor and stromal fibroblasts that provide bone marrow microenvironment may be altered. Alternatively, FeLV provirus may cause bone marrow disorders by inducing the expression of antigens on the cell surface, resulting in an immune-mediated destruction of the cell.
                - paragraph [ref=f38e293]:
                  - text: Anemia is a major non-neoplastic complication that occurs in a majority of symptomatic FeLV-infected cats (
                  - link "Gleich and Hartmann, 2009" [ref=f38e294] [cursor=pointer]:
                    - /url: "#bib0270"
                  - text: ). Anemia in FeLV-infected cats may have various causes. Approximately 10% of FeLV-associated anemias are regenerative (
                  - link "Shelton and Linenberger, 1995" [ref=f38e295] [cursor=pointer]:
                    - /url: "#bib0785"
                  - text: ), most FeLV-associated anemias, however, are non-regenerative and caused by the bone marrow-suppressive effect of the virus resulting from primary infection of hematopoietic stem cells and infection of stroma cells that constitute the supporting environment for hematopoietic cells.
                  - emphasis [ref=f38e296]: In vitro
                  - text: exposure of normal feline bone marrow to some strains of FeLV causes suppression of erythrogenesis (
                  - link "Cotter, 1998" [ref=f38e297] [cursor=pointer]:
                    - /url: "#bib0140"
                  - text: ). In addition to the direct effect of the virus on erythropoiesis, other factors can cause non-regenerative anemia in FeLV-infected cats (e.g., anemia of chronic disease promoted by high concentration of cytokines). FeLV infection may cause decreased platelet counts. It also may be responsible for platelet function deficits, and the lifespan of platelets is shortened in some FeLV-infected cats. Thrombocytopenia (resulting in bleeding disorders) may occur secondary to decreased platelet production from FeLV-induced bone marrow suppression or leukemic infiltration. Platelets harbor FeLV proteins as a result of infection, and megakaryocytes are frequent targets of progressive FeLV infection. Immune-mediated thrombocytopenia often accompanies IMHA in cats with underlying FeLV infection. FeLV infection also may cause decreased neutrophil or lymphocyte counts. Neutropenia is common in FeLV-infected cats (
                  - link "Brown and Rogers, 2001" [ref=f38e298] [cursor=pointer]:
                    - /url: "#bib0100"
                  - text: ) and generally occurs alone or in conjunction with other cytopenias. In some cases, myeloid hypoplasia of all granulocytic stages is observed, suggesting direct cytopathic infection on neutrophil precursors by FeLV. In some neutropenic FeLV-infected cats, an arrest in bone marrow maturation may occur at the myelocyte and metamyelocyte stages. Immune-mediated mechanisms may alternatively be responsible in cases in which neutrophil counts recover with glucocorticoid treatment (“glucocorticoid-responsive neutropenia”).
                - paragraph [ref=f38e299]:
                  - text: Feline panleukopenia-like syndrome (FPLS), also known as FeLV-associated enteritis (FAE) or myeloblastopenia, consists of severe leukopenia (<3000 cells/μl) with enteritis and destruction of intestinal crypt epithelium that mimics feline panleukopenia caused by feline panleukopenia virus (FPV) infection. However, FPV antigen has been demonstrated by IFA in intestinal sections of cats that died from this syndrome after being experimentally infected with FeLV (
                  - link "Lutz et al., 1995" [ref=f38e300] [cursor=pointer]:
                    - /url: "#bib0500"
                  - text: ). FPV was also demonstrated by electron microscopy despite negative FPV antigen tests. It appears that this syndrome may actually not be caused by FeLV itself, as previously thought, but by co-infection with FPV. The syndromes also has been referred to as FAE in cats with progressive FeLV infection because the clinical signs observed are usually gastronintestinal, including hemorrhagic diarrhea, vomiting, oral ulceration or gingivitis, anorexia, and weight loss (
                  - link "Kipar et al., 2000" [ref=f38e301] [cursor=pointer]:
                    - /url: "#bib0410"
                  - text: ","
                  - link "Kipar et al., 2001" [ref=f38e302] [cursor=pointer]:
                    - /url: "#bib0415"
                  - text: ). It is still unclear whether all these syndromes have the same origin and are simply caused by co-infection with FPV (and even modified life FPV vaccines have been discussed) or if they are caused by FeLV itself (
                  - link "Lutz et al., 1995" [ref=f38e303] [cursor=pointer]:
                    - /url: "#bib0500"
                  - text: ).
                - paragraph [ref=f38e304]:
                  - text: Hematopoietic neoplasia (“myeloprolifertaive disorders”), including leukemia, may also cause bone marrow suppression syndromes by replacing bone marrow cells. Myelodysplastic syndrome (MDS), characterized by peripheral blood cytopenias and dysplastic changes in the bone marrow, is a pre-stage of acute myeloic leukemia. It was found that changes of the LTR of FeLV (presence of three tandem direct 47-bp repeats in the upstream region of the enhancer (URE)) are strongly associated with the induction of MDS (
                  - link "Hisasue et al., 2009" [ref=f38e305] [cursor=pointer]:
                    - /url: "#bib0340"
                  - text: ). Myelofibrosis, another bone marrow suppression syndrome characterized by abnormal proliferation of fibroblasts resulting from chronic stimulation of the bone marrow, such as chronic bone marrow activity from hyperplastic or neoplastic regeneration, may also be caused by FeLV. In severe cases, the entire endosteum within the medullary cavity can be obliterated.
                - paragraph [ref=f38e306]:
                  - text: FeLV can cause different tumors in cats, most commonly lymphoma and leukemia, less commonly other hematopoietic tumors. The most important mechanism by which FeLV causes malignancy is by insertion of the FeLV genome into the cellular genome near a cellular oncogene (most commonly
                  - emphasis [ref=f38e307]: myc
                  - text: ), resulting in activation and over-expression of that gene. These effects lead to uncontrolled proliferation of that cell (clone). A malignancy results in the absence of an appropriate immune response. FeLV-A may also incorporate the oncogene to form a recombinant virus (e.g., FeLV-B, FeSV) containing cellular oncogene sequences that are then rearranged and activated. When they enter a new cell, these recombinant viruses are oncogenic. In a study of 119 cats with lymphomas, transduction or insertion of the
                  - emphasis [ref=f38e308]: myc
                  - text: locus had occurred in 38 cats (32%) (
                  - link "Tsatsanis et al., 1994" [ref=f38e309] [cursor=pointer]:
                    - /url: "#bib0860"
                  - text: ). Thus, FeLV-induced neoplasms are caused, at least in part, by somatically acquired insertional mutagenesis in which the integrated provirus may activate a proto-oncogene or disrupt a tumor suppressor gene. A recent study suggested that the U3-LTR region of FeLV transactivates cancer-related signaling pathways through production of a non-coding 104 base RNA transcript that activates NF kappaB (
                  - link "Forman et al., 2009" [ref=f38e310] [cursor=pointer]:
                    - /url: "#bib0235"
                  - text: "). Common integration sites for FeLV associated with lymphoma development have been identified in six loci:"
                  - emphasis [ref=f38e311]: c-myc
                  - text: ","
                  - emphasis [ref=f38e312]: flvi-1
                  - text: ","
                  - emphasis [ref=f38e313]: flvi-2
                  - text: (contains
                  - emphasis [ref=f38e314]: bmi-1
                  - text: ),
                  - emphasis [ref=f38e315]: fit-1
                  - text: ","
                  - emphasis [ref=f38e316]: pim-1
                  - text: ", and"
                  - emphasis [ref=f38e317]: flit-1
                  - text: . Oncogenic association of the loci has been suggested because
                  - emphasis [ref=f38e318]: c-myc
                  - text: is known as a proto-oncogene,
                  - emphasis [ref=f38e319]: bmi-1
                  - text: and
                  - emphasis [ref=f38e320]: pim-1
                  - text: have been recognized as
                  - emphasis [ref=f38e321]: myc
                  - text: "-collaborators,"
                  - emphasis [ref=f38e322]: fit-1
                  - text: appears to be closely linked to
                  - emphasis [ref=f38e323]: myb
                  - text: ", and"
                  - emphasis [ref=f38e324]: flit-1
                  - text: insertion was shown to be associated with over-expression of cellular genes, e.g., activin-A receptor type II-like 1 (
                  - emphasis [ref=f38e325]: ACVRL1
                  - text: ) (
                  - link "Fujino et al., 2008" [ref=f38e326] [cursor=pointer]:
                    - /url: "#bib0255"
                  - text: ).
                  - emphasis [ref=f38e327]: Flit-1
                  - text: especially seems to play an important role in the development of thymic lymphomas and appears to represent a novel FeLV proviral common integration domain that may influence lymphomagenesis through insertional mutagenesis. Among 35 FeLV-related tumors, five of 25 thymic lymphomas demonstrated proviral insertion within
                  - emphasis [ref=f38e328]: flit-1
                  - text: locus, whereas none of four alimentary, five multicentric lymphomas, and one T-lymphoid leukemia examined had rearrangement in this region. Expression of
                  - emphasis [ref=f38e329]: ACVRL1
                  - text: mRNA was detected the two thymic lymphomas with
                  - emphasis [ref=f38e330]: flit-1
                  - text: rearrangement, whereas normal thymuses and seven lymphoid tumors without
                  - emphasis [ref=f38e331]: flit-1
                  - text: rearrangement had no detectable
                  - emphasis [ref=f38e332]: ACVRL1
                  - text: mRNA expression (
                  - link "Fujino et al., 2009" [ref=f38e333] [cursor=pointer]:
                    - /url: "#bib0250"
                  - text: ).
                - paragraph [ref=f38e334]:
                  - text: The association between FeLV and lymphomas has been clearly established in several ways. First, these malignancies can be induced in kittens by experimental FeLV infection (
                  - link "Rickard et al., 1969" [ref=f38e335] [cursor=pointer]:
                    - /url: "#bib0730"
                  - text: ","
                  - link "Hardy et al., 1973" [ref=f38e336] [cursor=pointer]:
                    - /url: "#bib0310"
                  - text: ","
                  - link "Jarrett et al., 1973" [ref=f38e337] [cursor=pointer]:
                    - /url: "#bib0385"
                  - text: ). Second, cats naturally infected with FeLV have a higher risk of developing lymphoma than uninfected cats (
                  - link "Hardy et al., 1973" [ref=f38e338] [cursor=pointer]:
                    - /url: "#bib0310"
                  - text: ","
                  - link "Essex et al., 1975" [ref=f38e339] [cursor=pointer]:
                    - /url: "#bib0205"
                  - text: ). Third, most cats with lymphoma were – at least in earlier times when prevalence of FeLV was still higher – FeLV-positive in tests that detected infectious virus or FeLV antigens. Previously, up to 80% of feline lymphomas and leukemias were reported to be FeLV related (
                  - link "Cotter et al., 1975" [ref=f38e340] [cursor=pointer]:
                    - /url: "#bib0145"
                  - text: ","
                  - link "Francis et al., 1977" [ref=f38e341] [cursor=pointer]:
                    - /url: "#bib0245"
                  - text: ","
                  - link "Francis et al., 1979" [ref=f38e342] [cursor=pointer]:
                    - /url: "#bib0240"
                  - text: ","
                  - link "Hardy et al., 1980" [ref=f38e343] [cursor=pointer]:
                    - /url: "#bib0315"
                  - text: ","
                  - link "Reinacher, 1987" [ref=f38e344] [cursor=pointer]:
                    - /url: "#bib0720"
                  - text: ","
                  - link "Shelton et al., 1990" [ref=f38e345] [cursor=pointer]:
                    - /url: "#bib0780"
                  - text: ","
                  - link "Harrus et al., 2002" [ref=f38e346] [cursor=pointer]:
                    - /url: "#bib0325"
                  - text: ). However, since 1980, a dramatic reduction in the prevalence of viremia has been noted in cats with lymphoma (
                  - link "Mauldin et al., 1995" [ref=f38e347] [cursor=pointer]:
                    - /url: "#bib0510"
                  - text: ","
                  - link "Moore et al., 1996" [ref=f38e348] [cursor=pointer]:
                    - /url: "#bib0560"
                  - text: ","
                  - link "Hartmann et al., 1998" [ref=f38e349] [cursor=pointer]:
                    - /url: "#bib0330"
                  - text: ). The decrease in prevalence of FeLV infection in cats with lymphoma or leukemia also indicates a shift in tumor causation in recent years. Whereas 59% of all cats with lymphoma or leukemia were FeLV antigen-positive in one German study from 1980 to 1995, only 20% of the cats were FeLV antigen-positive in the years 1996 to 1999 in the same university veterinary clinic (
                  - link "Hartmann et al., 1998" [ref=f38e350] [cursor=pointer]:
                    - /url: "#bib0330"
                  - text: ). A recent study in this area confirmed the low prevalence of FeLV antigenemia in cats with lymphoma; in the study, 16 of 77 cats (21%) were FeLV antigen-positive (
                  - link "Stützer et al., 2011" [ref=f38e351] [cursor=pointer]:
                    - /url: "#bib0815"
                  - text: ). In a study in the Netherlands, only four of 71 cats with lymphoma were FeLV-positive, although 22 of these cats had mediastinal lymphoma, which was previously highly associated with FeLV infection (
                  - link "Teske et al., 2002" [ref=f38e352] [cursor=pointer]:
                    - /url: "#bib0840"
                  - text: ). Today, a higher lymphoma incidence in older FeLV antigen-negative cats is observed. The major reason for the decreasing association of FeLV with lymphoma is the decreasing prevalence of FeLV infection in the overall cat population as a result of FeLV vaccination as well as testing and elimination programs. However, prevalence of lymphoma caused by FeLV may be higher than indicated by conventional antigen testing of blood. Cats from FeLV cluster households had a 40-fold higher rate of development of FeLV-negative lymphoma than did those from the general population. FeLV-negative lymphomas have also occurred in laboratory cats known to have been infected previously with FeLV (
                  - link "Rohn et al., 1994" [ref=f38e353] [cursor=pointer]:
                    - /url: "#bib0745"
                  - text: ). FeLV proviral DNA was detected in lymphomas of older cats that tested negative for FeLV antigen, also suggesting that the virus may be associated with a larger proportion of lymphomas than previously thought. PCR detected proviral DNA in formalin-fixed, paraffin-embedded tumor tissue in seven of 11 FeLV-negative cats with lymphoma (
                  - link "Jackson et al., 1993" [ref=f38e354] [cursor=pointer]:
                    - /url: "#bib0380"
                  - text: ). However, other groups found evidence of provirus in only one of 22 (
                  - link "Sheets et al., 1993" [ref=f38e355] [cursor=pointer]:
                    - /url: "#bib0775"
                  - text: ) or in none of 61 FeLV antigen-negative lymphomas (
                  - link "Hartmann et al., 1998" [ref=f38e356] [cursor=pointer]:
                    - /url: "#bib0330"
                  - text: ). The FeLV status of cats with lymphomas still varies, depending on the type and locations of tumors. Lymphomas in FeLV antigen-positive cats are mainly of a T-cell origin; those in FeLV antigen-negative cats are mainly of a B-cell origin (
                  - link "Hardy et al., 1977" [ref=f38e357] [cursor=pointer]:
                    - /url: "#bib0320"
                  - text: ","
                  - link "Francis et al., 1979" [ref=f38e358] [cursor=pointer]:
                    - /url: "#bib0240"
                  - text: ","
                  - link "Hardy, 1981" [ref=f38e359] [cursor=pointer]:
                    - /url: "#bib0305"
                  - text: ","
                  - link "Neil et al., 1984" [ref=f38e360] [cursor=pointer]:
                    - /url: "#bib0575"
                  - text: ). This was confirmed in a recent study in which 8/28 (64.3%) FeLV antigen-negative cats with lymphoma had T-cell lymphoma, while none of the FeLV antigen-positive cats (0/8) had B-cell lymphoma (
                  - link "Stützer et al., 2011" [ref=f38e361] [cursor=pointer]:
                    - /url: "#bib0815"
                  - text: ). A potential reason may be that FeLV transforms mature T cells and immature or prothymocytes, null cells, and possibly monocytes. Transformation of mature B cells does not seem to occur, because feline lymphoma cell lines and primary tumors lack surface immunoglobulin expression (
                  - link "Rojko et al., 1989" [ref=f38e362] [cursor=pointer]:
                    - /url: "#bib0750"
                  - text: ). The rare feline large granular lymphocyte (LGL) lymphoma, a morphologically distinct variant of feline lymphoma with grave prognosis, does not seem to be commonly associated with FeLV. In a study of 45 cats with LGL lymphoma, none of the cats was FeLV antigen-positive (
                  - link "Krick et al., 2008" [ref=f38e363] [cursor=pointer]:
                    - /url: "#bib0430"
                  - text: ). Similarly, low grade lymphomas are usually not associated with FeLV; in a study of 41 low grade lymphocytic lymphomas, none of the cats was FeLV antigen-positive (
                  - link "Kiselow et al., 2008" [ref=f38e364] [cursor=pointer]:
                    - /url: "#bib0420"
                  - text: ).
                - paragraph [ref=f38e365]:
                  - text: Fibrosarcomas that are associated with FeLV are caused by FeSV, a recombinant virus that develops
                  - emphasis [ref=f38e366]: de novo
                  - text: in FeLV-A-infected cats by recombination of the FeLV-A genome with cellular oncogenes (
                  - link "Besmer et al., 1986" [ref=f38e367] [cursor=pointer]:
                    - /url: "#bib0065"
                  - text: ). Through a process of genetic recombination, FeSV acquires one of several oncogenes, such as
                  - emphasis [ref=f38e368]: fes, fms
                  - text: ", or"
                  - emphasis [ref=f38e369]: fgr
                  - text: (
                  - link "Besmer et al., 1983" [ref=f38e370] [cursor=pointer]:
                    - /url: "#bib0060"
                  - text: ). As a result, FeSV is an acutely transforming (tumor-causing) virus, leading to a polyclonal malignancy with multifocal tumors arising simultaneously after a short incubation period (
                  - link "McDonald et al., 1976" [ref=f38e371] [cursor=pointer]:
                    - /url: "#bib0515"
                  - text: ","
                  - link "Pedersen et al., 1984" [ref=f38e372] [cursor=pointer]:
                    - /url: "#bib0635"
                  - text: ). With the decrease in FeLV prevalence, FeSV also has become less common. FeSV-induced fibrosarcomas are multicentric and usually occur in young cats. Strains of FeSV identified from naturally occurring tumors are defective and unable to replicate without the presence of FeLV-A as a helper virus that supplies proteins (such as those coded by the
                  - emphasis [ref=f38e373]: env
                  - text: gene) to FeSV (Rojko et al., 1994). Fibrosarcomas caused by FeSV tend to grow rapidly, often with multiple cutaneous or subcutaneous nodules that are locally invasive and metastasize to the lung and other sites (
                  - link "Pedersen et al., 1984" [ref=f38e374] [cursor=pointer]:
                    - /url: "#bib0635"
                  - text: ). Solitary fibrosarcomas in older cats are not caused by FeSV. These tumors are slower growing, locally invasive, slower metastasizing, and occasionally curable by excision combined with radiation and/or gene therapy. These tumors are usually injection site-associated sarcomas (ISAS) caused by the granulomatous inflammatory reaction at the injection site, commonly occurring after inoculation of adjuvant-containing vaccines. It has been demonstrated that neither FeSV nor FeLV play any role in ISAS (
                  - link "Ellis et al., 1996" [ref=f38e375] [cursor=pointer]:
                    - /url: "#bib0185"
                  - text: ).
                - paragraph [ref=f38e376]:
                  - text: A number of other tumors have been found in FeLV-infected cats; some of them may have an association with FeLV, others have just been observed by chance simultaneously in an infected cat. Iris melanomas, for example, are not associated with FeLV infections. An association has been hypothesized because of one study in which three of 18 eyes had positive test results for FeLV-FeSV proviral DNA (
                  - link "Stiles et al., 1999" [ref=f38e377] [cursor=pointer]:
                    - /url: "#bib0805"
                  - text: ). However in a more recent study, immunohistochemical staining and PCR did not reveal FeLV or FeSV in the ocular tissues of any cats with this disorder (
                  - link "Cullen et al., 2002" [ref=f38e378] [cursor=pointer]:
                    - /url: "#bib0155"
                  - text: ). Multiple osteochondromas (cartilaginous exostoses on flat bones of unknown pathogenesis) have been described in FeLV-infected cats. Although histologically benign, they may cause significant morbidity if they occur in an area such as a vertebra and put pressure on the spinal cord or nerve roots (
                  - link "Pool and Carrig, 1972" [ref=f38e379] [cursor=pointer]:
                    - /url: "#bib0690"
                  - text: ","
                  - link "Lott-Stolz, 1988" [ref=f38e380] [cursor=pointer]:
                    - /url: "#bib0490"
                  - text: ). In spontaneous feline olfactory neuroblastomas (aggressive, histologically inhomogenous tumors of the tasting and smelling epithelium of nose and pharynx with high metastasis rates), budding FeLV particles were found in the tumors and lymph node metastases, and FeLV DNA was found in tumor tissue (
                  - link "Schrenzel et al., 1990" [ref=f38e381] [cursor=pointer]:
                    - /url: "#bib0760"
                  - text: ). The exact role of FeLV in the genesis of these tumors is uncertain. Cutaneous horns are a benign hyperplasia of keratinocytes that have been described in FeLV-infected cats (
                  - link "Pedersen, 1991" [ref=f38e382] [cursor=pointer]:
                    - /url: "#bib0630"
                  - text: ), but again the role of FeLV is unclear.
                - paragraph [ref=f38e383]:
                  - text: Other syndromes directly caused by FeLV infection include FeLV-associated neuropathy, reproductive disorders, and fading kitten syndrome. Although most neurologic signs seen in FeLV-infected cats are caused by lymphoma and lymphocytic infiltrations in brain or spinal cord leading to compression, in some cases no tumor is detectable with diagnostic imaging methods or in necropsy, and FeLV-induced neurotoxicity is suspected. Anisocoria, mydriasis, central blindness, or Horner's syndrome have been described in FeLV-infected cats without morphologic changes. In some regions (such as the southeastern United States), urinary incontinence caused by neuropathies in FeLV-infected cats has been described (
                  - link "Carmichael et al., 2002" [ref=f38e384] [cursor=pointer]:
                    - /url: "#bib0125"
                  - text: ). Direct neurotoxic effects of FeLV have been discussed as pathogenetic mechanisms. FeLV envelope glycoproteins may be able to produce increased intracellular free calcium leading to neuronal death (this has also been described in HIV-infected humans). A polypeptide of the FeLV envelope was found to cause dose-dependent neurotoxicity associated with alterations in intracellular calcium ion concentration, neuronal survival, and neurite outgrowth. The polypeptide from an FeLV-C strain was significantly more neurotoxic than the same peptide derived from an FeLV-A strain (
                  - link "Fails et al., 1997" [ref=f38e385] [cursor=pointer]:
                    - /url: "#bib0210"
                  - text: ","
                  - link "Mitchell et al., 1997" [ref=f38e386] [cursor=pointer]:
                    - /url: "#bib0535"
                  - text: ). Clinical signs in 16 cats with progressive FeLV infection and neurologic signs consisted of abnormal vocalization, hyperesthesia, and paresis progressing to paralysis. Some cats developed anisocoria or urinary incontinence during the course of their illness. Affected cats developed gradually progressive neurologic dysfunction. Microscopically, white-matter degeneration with dilation of myelin sheaths and swollen axons was identified in the spinal cord and brain stem of affected animals (
                  - link "Carmichael et al., 2002" [ref=f38e387] [cursor=pointer]:
                    - /url: "#bib0125"
                  - text: ). Immunohistochemical staining of affected tissues revealed consistent expression of FeLV p27 antigens in neurons, endothelial cells, and glial cells, and proviral DNA was amplified from multiple sections of spinal cord (
                  - link "Carmichael et al., 2002" [ref=f38e388] [cursor=pointer]:
                    - /url: "#bib0125"
                  - text: ). These findings suggest that in some FeLV-infected cats, the virus may directly affect CNS cells cytopathically.
                - paragraph [ref=f38e389]:
                  - text: FeLV-infected queens can transmit the virus transplacentally. Reproductive failure in form of fetal resorption, abortion, and neonatal death is common if
                  - emphasis [ref=f38e390]: in utero
                  - text: FeLV infection occurs. The apparent infertility might actually be caused by early resorption of fetuses. Abortions usually occur late in gestation, with expulsion of normal appearing fetuses. Bacterial endometritis may accompany these abortions, particularly in cats with neutropenia (
                  - link "Cotter, 1998" [ref=f38e391] [cursor=pointer]:
                    - /url: "#bib0140"
                  - text: ).
                - paragraph [ref=f38e392]:
                  - text: Kittens born to infected queens may become exposed to FeLV transplacentally, but heavy exposure also occurs at birth and throughout the nursing period. Some kittens become immune, but most become progressively infected and die at an early age of the so-called fading kitten syndrome, characterized by failure to nurse, dehydration, hypothermia, thymic atrophy, and death within the first two weeks of life (
                  - link "Levy, 2000c" [ref=f38e393] [cursor=pointer]:
                    - /url: "#bib0470"
                  - text: ).
              - generic [ref=f38e394]:
                - heading "3. Discussion" [level=2] [ref=f38e395]
                - paragraph [ref=f38e396]: Most knowledge about clinical aspects of FIV and FeLV infection as well as on the pathophysiology and immunological background of both infections derive from experimental studies. However, the relevance of these experimental data to the naturally occurring disease is unclear, and it remains an unanswered question on how or whether the experimental data can be applied to the clinical setting in the field. It is the impression of many clinicians that in most naturally infected cats, FIV does not cause a severe clinical syndrome. Most clinical signs in FIV-infected cats reflect secondary diseases such as infections and neoplasia to which FIV-infected cats are considered more susceptible. With proper care, FIV-infected cats can live many years and, in fact, may die at an old age from causes unrelated to their FIV infection. Although FeLV causes more severe clinical syndromes, and despite the fact that progressive FeLV infection is associated with a decrease in life expectancy, many owners still elect to provide therapy for their FeLV-infected cats, and with proper treatment, FeLV-infected cats in single-cat households may also live for many years with good quality of life. As in FIV infection, diseases secondary to immunosuppression account for a large portion of the syndromes seen in FeLV-infected cats, and it is important to realize that many of these secondary diseases are treatable. Many reports have been made of FeLV-infected cats having concurrent bacterial, viral, protozoal, and fungal infections, but few studies exist proving that these cats have a higher rate of infection than do FeLV-negative cats. Thus, although FeLV certainly can suppress immune function, it should not be assumed that all concurrent infections are a direct consequence of FeLV infection. While long-term studies describing clinical outcomes of naturally occurring FIV and FeLV infection are lacking, modalities for treatment of secondary infections or other co-incident diseases are in many cases available, and by treating these symptomatically, the life expectancy and quality of life of FIV- and FeLV-infected animals can be significantly enhanced. Studies that compare FIV- and FeLV-related secondary complications (e.g., infections, tumors) with the prevalence of these diseases in the absence of FIV and FeLV infection need to be performed in naturally occurring studies to definitively demonstrate these associations.
              - generic [ref=f38e397]:
                - heading "Conflict of interest" [level=2] [ref=f38e398]
                - paragraph [ref=f38e399]: There was no conflict of interest associated with this article.
