            - generic [ref=f38e64]:
              - heading "Clinical aspects of feline immunodeficiency and feline leukemia virus infection" [level=1] [ref=f38e66]
              - generic [ref=f38e67]:
                - link "Katrin Hartmann" [ref=f38e68] [cursor=pointer]:
                  - /url: https://pubmed.ncbi.nlm.nih.gov/?term="Hartmann%20K"[Author]
                - superscript [ref=f38e69]: 1,
                - superscript [ref=f38e70]: ⁎
