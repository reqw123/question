            - generic [ref=f4e197]:
              - heading "1 Introduction" [level=2] [ref=f4e198]
              - generic [ref=f4e199]:
                - paragraph [ref=f4e200]:
                  - text: Human-created machines are already able to do all-encompassing types of labor-intensive work. Yet, on many occasions, driven by demands for higher productivity and perhaps simply curiosity, humans have been trying to infuse human intelligence into machines, which constitutes the original motivation of Artificial Intelligence (AI). AI research has been going on for over 65 years and has made impressive achievements in terms of theoretical study and real-world applications [
                  - link "Reference 1" [ref=f4e201] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR1
                    - text: "1"
                  - text: ","
                  - link "Reference 2" [ref=f4e202] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR2
                    - text: "2"
                  - text: "]. AI is being used almost everywhere and is considered a core skill for the future. The AI market is projected to grow to $190 billion by 2025, at a CAGR (compound annual growth rate) of over 36% between 2018 and 2025 ["
                  - link "Reference 3" [ref=f4e203] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR3
                    - text: "3"
                  - text: "]."
                - paragraph [ref=f4e204]: There are many definitions of artificial intelligence. In the Turing test, AI is defined as the ability of machines to communicate with humans (using electronic output devices) without revealing the identity that they are not humans, where the essential judgment criterion is binary. Marvin Minky, one of the pioneers of AI, defined AI as enabling machines to do things that require human intelligence. The symbolic school believes that AI is the operation of symbols, and the most primitive symbols correspond to the physical entities. Although the descriptions of AI are various, the core of AI is widely believed to be the research theories, methods, technologies, and applications for simulating, extending, and expanding human intelligence. Nowadays, the concept of AI has an increasingly profound impact on human life. As the roles of steam engines in the Age of Steam, generators in the Age of Electricity, and computers in the Age of Information, AI is the pillar of technology in the contemporary era and beyond.
                - paragraph [ref=f4e205]:
                  - text: “AI” has become a buzzword in almost every aspect of our lives. The semantic network graph (Fig.
                  - link "1" [ref=f4e206] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Fig1
                  - text: ) is built based on the search results in Web of Science (2021-08-26) and plotted using the VOS Viewer software. It shows the impact degree and the connections of the keywords that are most related to AI. According to the color of the links, it can be ascertained that the “application” of AI has received great attention in the literature. The concept is closely related to “system” sciences while “neural network,” “classification,” and “prediction” are the main focuses in terms of algorithms. The research fields of AI include systems and engineering, brain science, psychology, cognitive science, mathematics, computer science, and many other fields. The application fields of AI are extensive, covering (but not limited to) speech recognition [
                  - link "Reference 4" [ref=f4e207] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR4
                    - text: "4"
                  - text: ","
                  - link "Reference 5" [ref=f4e208] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR5
                    - text: "5"
                  - text: "], image processing ["
                  - link "Reference 6" [ref=f4e209] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR6
                    - text: "6"
                  - text: ","
                  - link "Reference 7" [ref=f4e210] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR7
                    - text: "7"
                  - text: "], natural language processing ["
                  - link "Reference 8" [ref=f4e211] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR8
                    - text: "8"
                  - text: ","
                  - link "Reference 9" [ref=f4e212] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR9
                    - text: "9"
                  - text: "], smart robots ["
                  - link "Reference 10" [ref=f4e213] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR10
                    - text: "10"
                  - text: ","
                  - link "Reference 11" [ref=f4e214] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR11
                    - text: "11"
                  - text: "], autonomous vehicles ["
                  - link "Reference 12" [ref=f4e215] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR12
                    - text: "12"
                  - text: ","
                  - link "Reference 13" [ref=f4e216] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR13
                    - text: "13"
                  - text: "], energy systems ["
                  - link "Reference 14" [ref=f4e217] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR14
                    - text: "14"
                  - text: ","
                  - link "Reference 15" [ref=f4e218] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR15
                    - text: "15"
                  - text: "], healthcare ["
                  - link "Reference 16" [ref=f4e219] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR16
                    - text: "16"
                  - text: ","
                  - link "Reference 17" [ref=f4e220] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR17
                    - text: "17"
                  - text: "], Fintech ["
                  - link "Reference 18" [ref=f4e221] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR18
                    - text: "18"
                  - text: "], etc. In limited areas, AI has surpassed humans. The phenomenon of ever-increasing AI-beyond-humans has triggered a new wave of discussion on how AI may change human society. Although many AI applications are stunning, they have not frightened us in the way of the sci-fi movies such as The Terminator or The Matrix because the capability is designed to be area-specific and non-comprehensive. It will be discussed in the subsequent sections that the mainstream success is limited to ANI (artificial narrow intelligence) rather than AGI (artificial general intelligence). Nevertheless, it is not always the case from a long-term historical and forward-looking perspective. Therefore, at these critical times of rapid development of AI technologies, it is believed to be the time to discuss the past, the present, and the future of both AI tools and AI systems."
                - figure "Fig. 1" [ref=f4e223]:
                  - generic [ref=f4e226]:
                    - generic [ref=f4e227]:
                      - img "Fig. 1" [ref=f4e229]
                      - link "Full size image figure 1" [ref=f4e231] [cursor=pointer]:
                        - /url: /article/10.1007/s44163-022-00022-8/figures/1
