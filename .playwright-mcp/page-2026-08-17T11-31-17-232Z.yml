                - paragraph [ref=f4e236]:
                  - text: The article is unfolded along the time axis, focusing on the past, the present, and the future. Specifically, the content is organized as follows. The next part introduces the history of AI development, including the Birth of AI, the AI winters, and the resurgence of AI. In Sect.
                  - link "3" [ref=f4e237] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Sec6
                  - text: ", the state-of-the-art AI and the advancements in the discipline are introduced, including Artificial Narrow Intelligence (ANI), Autonomous systems, Symbiotic Systems, and Human-in-the-Loop Systems. Section"
                  - link "4" [ref=f4e238] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Sec12
                  - text: discusses the future of AI, including Understanding and Cognition, Artificial General Intelligence, Singularity, and Artificial Super Intelligence. The last section concludes the article.
            - generic [ref=f4e240]:
              - heading "2 Past" [level=2] [ref=f4e241]
              - generic [ref=f4e242]:
                - paragraph [ref=f4e243]:
                  - text: Figure
                  - link "2" [ref=f4e244] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Fig2
                  - text: shows a timeline that sketches the history of AI by highlighting the important events. In the following part, a discussion will be made aligned with the timeline in general, yet more detailed examples and an inclination to the underlying factors that impact the prosperity of AI research and development will be presented.
                - figure "Fig. 2" [ref=f4e246]:
                  - generic [ref=f4e249]:
                    - generic [ref=f4e250]:
                      - img "Fig. 2" [ref=f4e252]
                      - link "Full size image figure 2" [ref=f4e254] [cursor=pointer]:
                        - /url: /article/10.1007/s44163-022-00022-8/figures/2
                        - text: Full size image
                    - paragraph [ref=f4e258]:
                      - text: The timeline of AI (copied with permission from [
                      - link "Reference 1" [ref=f4e259] [cursor=pointer]:
                        - /url: /article/10.1007/s44163-022-00022-8#ref-CR1
                        - text: "1"
                      - text: "])"
                - heading "2.1 The birth of AI and the golden age" [level=3] [ref=f4e260]
                - paragraph [ref=f4e261]:
                  - text: The period before the year 1956 is regarded as the incubation period of AI. Until that time, scientists and engineers tried to replace part of their mental work with machines. In 1936, mathematician Alan Turing proposed a mathematical model of an ideal computer, which laid the theoretical foundation for later to come electronic computers. Neurophysiologists W. McCulloch and W. Pitts built the first neural network model (M-P model) in 1943 [
                  - link "Reference 19" [ref=f4e262] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR19
                    - text: "19"
                  - text: "]. The M-P model is the first mathematical model constructed to mimic the structure and the working principle of biological neurons. It can be regarded as the earliest artificial neural network. Back in 1949, Hebb proposed the learning mechanism based on neuropsychology ["
                  - link "Reference 20" [ref=f4e263] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR20
                    - text: "20"
                  - text: "]. “Hebb learning rule” is an unsupervised learning rule, which can extract statistical features of the training sets and classify data according to data similarity. This is the earliest idea of machine learning (ML), and it is very close to the process of human cognition. In 1952, IBM scientist Arthur Samuel developed a checkers program that could learn implicit models from the current position and instruct subsequent moves ["
                  - link "Reference 21" [ref=f4e264] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR21
                    - text: "21"
                  - text: "]. In such context, chess programs were among the earliest work of evolutionary computing. The algorithm compares a modified copy to the best version, and the winner becomes the new standard."
                - paragraph [ref=f4e265]:
                  - text: It was John McCarthy who originally coined the term AI at the 1956 Dartmouth Summer Research Project on Artificial Intelligence [
                  - link "Reference 2" [ref=f4e266] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR2
                    - text: "2"
                  - text: "]. He is therefore considered to be the father of artificial intelligence. Since this event, the research into AI has rendered many remarkable achievements, including machine learning, theorem proving, pattern recognition, problem-solving, expert systems, and natural language processing."
                - paragraph [ref=f4e267]:
                  - text: In 1957, American psychologist Frank Rosenblatt introduced the “Perceptron” model [
                  - link "Reference 22" [ref=f4e268] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR22
                    - text: "22"
                  - text: "]. It can be used to build a system that uses “neurons” for recognition—the capability of learning profoundly impacted the subsequent design of neural networks and the connection mechanisms. The pioneering work on the perceptron is still a trendy topic in the introductory courses for AI today. In 1960, the perceptron algorithm was transmitted to a physical hardware implementation called “Mark 1 Perceptron” as the artificial brain ["
                  - link "Reference 23" [ref=f4e269] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR23
                    - text: "23"
                  - text: "], consisting of an array of perceptrons, connected to a camera. At that time, it was magical and inspiring for the people to see that a machine could be trained to distinguish whether a person in a photograph is a male or a female with reasonable accuracy. In the same year, Newell et al. summarized the thinking rules of humans through psychological experiments. They compiled a general problem-solving program, which could be used to solve 11 different types of problems ["
                  - link "Reference 24" [ref=f4e270] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR24
                    - text: "24"
                  - text: "]. A few years later, E. A. Feigenbaum from Stanford University designed an expert system ["
                  - link "Reference 25" [ref=f4e271] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR25
                    - text: "25"
                  - text: "]. The system could determine the molecular structure of compounds based on the experimental analysis of mass spectrometers. The study of AI during this period was groundbreaking, with outcomes showing excellent prospects ["
                  - link "Reference 26" [ref=f4e272] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR26
                    - text: "26"
                  - text: "]. Meanwhile, the field of computing developed as a field of its own. Transistors and hardware architectures progressed every year, and the essential software and computer programs emerged to implement the AI theories and algorithms."
                - heading "2.2 AI winters" [level=3] [ref=f4e273]
                - paragraph [ref=f4e274]:
                  - text: AI winters refer to the periods when the funding of AI significantly decreased due to disillusionments [
                  - link "Reference 1" [ref=f4e275] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR1
                    - text: "1"
                  - text: "]. There have been two recognized AI winters in history. The first was around the 1970s ["
                  - link "Reference 27" [ref=f4e276] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR27
                    - text: "27"
                  - text: "]. Earlier, the researchers had over-confidence in their preliminary results of machine translation. Excessive hype about an optimistic future of machine translation was attracting considerable investments in a context where the US Defense Establishment (the predecessor of DARPA today) expected an automatic Russian-to-English translation during the cold war. It turned out that the challenge of the task was way underestimated. Little progress was made from 1967 to 1976. The failure of machine translation disappointed the investigators and poisoned the development of the whole AI field. In 1966, the Automatic Language Processing Advisory Committee (ALPAC) submitted the report “Language and Machines” to the US government and refuted the feasibility of machine translation ["
                  - link "Reference 28" [ref=f4e277] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR28
                    - text: "28"
                  - text: "]. In 1969, Minsky and Papert published the Perceptrons ["
                  - link "Reference 29" [ref=f4e278] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR29
                    - text: "29"
                  - text: "], which pointed out the significant flaws of perceptron that perceptron can only solving linear problems. In 1973, the British Scientific Research Council (SRC) presented the Lighthill Report to the British government ["
                  - link "Reference 30" [ref=f4e279] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR30
                    - text: "30"
                  - text: "]. These criticisms triggered a significant shrinkage of the funding for fundamental research in AI."
                - paragraph [ref=f4e280]:
                  - text: As the effects of the first AI winter slowly faded away, a new wave of interest escalated in AI technologies oriented towards commercial applications. This time, expert systems were extensively implemented based on “if–then” rules set up by domain experts. Once again, its potential was hyped because people had insufficient awareness of its limitations in dealing with highly complex tasks and systems, such as medical diagnosis and vision systems. In 1984, John McCarthy commented that a critical defect of expert systems lies in the lack of knowledge about their limitations [
                  - link "Reference 31" [ref=f4e281] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR31
                    - text: "31"
                  - text: "]. In the late 1980s, another trough in AI development was experienced, accompanied by the withdrawal of funds and the shift of interest to other rising technologies such as general-purpose computers."
                - paragraph [ref=f4e282]:
                  - text: Despite the significant differences in the historical backgrounds, several common factors can be identified in the emergence of the AI winters [
                  - link "Reference 32" [ref=f4e283] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR32
                    - text: "32"
                  - text: "]. From a professional viewpoint, researchers had insufficient and biased evaluations about the pros and cons. Consequently, the predictions and the conclusions lacked rational, rigorous, practical, and comprehensive analysis. Furthermore, the news media acted as a catalyst in turning away the public focus from the real challenges that the researchers and the practitioners were facing ["
                  - link "Reference 33" [ref=f4e284] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR33
                    - text: "33"
                  - text: "]. Another explicit factor was the underdeveloped tools from the related disciplines, such as the unavailability of algorithmic approaches (mathematics), information resources (electrical engineering), and computing power and information infrastructure (computer science). Furthermore, the investigators were unaware of the risks and underestimated the required time for fundamental research. Large-scale investments and divestments were the triggers of the AI winters."
                - heading "2.3 The rise of AI" [level=3] [ref=f4e285]
                - paragraph [ref=f4e286]: Several vital factors facilitate the resurgence of AI.
                - paragraph [ref=f4e287]:
                  - text: First, the success of machine learning is one of the initial and base drives. Since late 1980s, a series of important ML theories and techniques have been proposed, many of which are necessary materials in today’s ML textbooks [
                  - link "Reference 34" [ref=f4e288] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR34
                    - text: "34"
                  - text: ","
                  - link "Reference 35" [ref=f4e289] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR35
                    - text: "35"
                  - text: "]. Typical ones include decision tree, proposed by J. R. Quinlan in 1986; support vector machine, proposed by Vapnik and Cortes in 1995; Adaboost, proposed by Freund and Schapire in 1997; random forests, proposed by Breiman in 2001. As for the neural network-related advancement in this period, it was not until the article promoting back-propagation published in 1986 on Nature ["
                  - link "Reference 36" [ref=f4e290] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR36
                    - text: "36"
                  - text: "] that the research community paid good attention. The successes in ML and the other progresses discussed below become complementary factors on the path of AI resurgence."
                - paragraph [ref=f4e291]:
                  - text: Second, colossal amounts of data are available as the fuels for model training [
                  - link "Reference 37" [ref=f4e292] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR37
                    - text: "37"
                  - text: ","
                  - link "Reference 38" [ref=f4e293] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR38
                    - text: "38"
                  - text: "]. The quality and the scale of the datasets are the determinants of the robust performance of prediction/classification ["
                  - link "Reference 39" [ref=f4e294] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR39
                    - text: "39"
                  - text: ","
                  - link "Reference 40" [ref=f4e295] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR40
                    - text: "40"
                  - text: "]. High-quality datasets built in typical and practical scenarios are encouraged to be shared in the research community. In this context, people devote efforts to designing and carrying out exhaustive experiments to collect real-world data, representing typical working conditions. In this process, the types of variables and how the data are measured constitute a part of the intellectual inputs by humans. As one of the key factors contributing to successful AI training, such experience has an unneglectable influence on the quality of the datasets in terms of comprehensiveness and typicality because it decides how well the data distribution of the constructed dataset can align with the ground truth. Publicly available datasets function as a baseline for defining AI challenges and for fair comparison of novel AI algorithms ["
                  - link "Reference 41" [ref=f4e296] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR41
                    - text: "41"
                  - text: "]."
                - paragraph [ref=f4e297]:
                  - text: Third, the rise of AI is associated with a significant increase in computing power [
                  - link "Reference 42" [ref=f4e298] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR42
                    - text: "42"
                  - text: ","
                  - link "Reference 43" [ref=f4e299] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR43
                    - text: "43"
                  - text: "]. The expansion in the physical scales of the AI-based machines enables them to deal with highly complicated tasks. In the meantime, it will inevitably slow down information transmission and processing and lead to plenty of energy consumption. A promising breakthrough is expected in terms of photon computing to overcome the bottleneck of today’s general practice based on electrons ["
                  - link "Reference 44" [ref=f4e300] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR44
                    - text: "44"
                  - text: "]. In addition to dealing with the maximum possible speed constrained by physical laws, numerous implementation challenges may cause significant delays. With advanced techniques of acceleration taking place in both hardware architecture ["
                  - link "Reference 45" [ref=f4e301] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR45
                    - text: "45"
                  - text: "] and software algorithms, the training tasks that usually take several months can be shortened to several days or even hours ["
                  - link "46" [ref=f4e302] [cursor=pointer]:
                    - /url: "#ref-CR46"
                  - text: ","
                  - link "47" [ref=f4e303] [cursor=pointer]:
                    - /url: "#ref-CR47"
                  - text: ","
                  - link "Reference 48" [ref=f4e304] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR48
                    - text: "48"
                  - text: "]. This is possible because different deep neural networks can be decomposed into several blocks where many required operations are the same. For example, a typical CNN (Convolutional Neural Network) block usually involves the processes of convolution, pooling, normalization, activation, and a fully connected layer ["
                  - link "Reference 49" [ref=f4e305] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR49
                    - text: "49"
                  - text: "]. In recent years, there have been fruitful outcomes reported about AI chips. Dedicated NPUs (Neural network Processing Units) have been developed and used on Kirin 970 chips and A11-A14 Bionic chips for iPhones. This makes it possible to perform real-time onboard (portable devices) tasks such as video processing for live broadcasts, fast biometric identification, and games with 3D rendering ["
                  - link "50" [ref=f4e306] [cursor=pointer]:
                    - /url: "#ref-CR50"
                  - text: ","
                  - link "51" [ref=f4e307] [cursor=pointer]:
                    - /url: "#ref-CR51"
                  - text: ","
                  - link "Reference 52" [ref=f4e308] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR52
                    - text: "52"
                  - text: "]."
                - paragraph [ref=f4e309]:
                  - text: Fourth, several AI systems that outperformed top human players in contests and competitions impressed the public and rebuilt confidence in AI [
                  - link "Reference 53" [ref=f4e310] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR53
                    - text: "53"
                  - text: ","
                  - link "Reference 54" [ref=f4e311] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR54
                    - text: "54"
                  - text: "]. In 2011, IBM’s AI system Watson won the championship at America’s popular quiz TV show “Jeopardy!”. Although it was not connected to the Internet, it had a four terabytes storage that covered 200 million pages of information, including the full version of Wikipedia. This is a remarkable achievement in implementing a machine with joint abilities ranging from information search to knowledge representation, automatic reasoning, and natural language processing. From 2016 to 2017, AlphaGo challenged professional go players and defeated over 60 human masters of go, including the world champion Lee Sedol and the worlds’ top-ranking player Ke Jie. The developer of AlphaGo, i.e., the team with Google’s DeepMind, later built a new AI system called AlphaGo Zero, which is entirely self-taught starting from scratch, with zero information from human’s game records. The system surpassed thousands of years of human knowledge with reinforcement learning and shockingly discovered novel strategies over a few days ["
                  - link "Reference 55" [ref=f4e312] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR55
                    - text: "55"
                  - text: "]. These examples show the dominating role of deep learning in the new AI age and demonstrate the phenomenal speed that AI can grow."
                - paragraph [ref=f4e313]:
                  - text: In Table
                  - link "1" [ref=f4e314] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Tab1
                  - text: ", the critical events in AI development during the past 25 years are summarized."
                - 'figure "Table 1 Important events in AI development: last 25 Years" [ref=f4e316]':
                  - link "Full size table 1" [ref=f4e319] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8/tables/1
                    - text: Full size table
            - generic [ref=f4e323]:
              - heading "3 Present" [level=2] [ref=f4e324]
              - generic [ref=f4e325]:
                - heading "3.1 Widespread use of ML and then DL" [level=3] [ref=f4e326]
                - paragraph [ref=f4e327]:
                  - text: "At the very beginning of Google’s Machine learning handbook, it writes, “If you can build a simple rule-based system that does not require machine learning, do that.” It can be interpreted in two ways: first, as a type of heuristic algorithm, machine learning still cannot achieve guaranteed performance with full interpretability; and second, ML may have satisfactory performance (but still, not guaranteed performance) in specific scenarios that rule-based methods cannot. There are considerable challenges in figuring out all the rules and steps for highly complex problems. Non-AI schemes designed purely by human intelligence would lead to significant defects in the solutions or decision logic ["
                  - link "Reference 57" [ref=f4e328] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR57
                    - text: "57"
                  - text: ","
                  - link "Reference 58" [ref=f4e329] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR58
                    - text: "58"
                  - text: "]. Likewise, expert systems mimic humans’ way of thinking and rely too much on domain knowledge and human experience. Furthermore, the key to designing an expert system lies in utilizing expertise rather than methodology. Due to insufficient generalization ability and low robustness, these methods soon reached a bottleneck in widespread applications."
                - paragraph [ref=f4e330]:
                  - text: Rather than specifying the inputs and the human-defined algorithms to obtain the outputs, an alternative means to solve complex problems is to select the inputs and the expected outputs and to use machines to find the patterns between them automatically and thus “learn” the algorithms [
                  - link "59" [ref=f4e331] [cursor=pointer]:
                    - /url: "#ref-CR59"
                  - text: ","
                  - link "60" [ref=f4e332] [cursor=pointer]:
                    - /url: "#ref-CR60"
                  - text: ","
                  - link "Reference 61" [ref=f4e333] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR61
                    - text: "61"
                  - text: "]. This is the general idea behind how (supervised) machine learning works. Machine Learning shows superiority in the following aspects. First, ML is good at learning from colossal amounts of structured data while humans are not, due to limited memory and brain capacity. Second, having “seen” an adequate number of training samples, the ML solutions obtained show good generalization capability. Third, each newly available data contributes to adjusting the input–output projections ["
                  - link "Reference 62" [ref=f4e334] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR62
                    - text: "62"
                  - text: "]. The learning process can be realized incrementally, which enables online and life-long learning ["
                  - link "Reference 63" [ref=f4e335] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR63
                    - text: "63"
                  - text: "]. Apart from supervised learning, there are also practical requirements for unsupervised learning. In many cases, the labels for the training data are unavailable due to the high workload and the need for domain experts. In one way, clustering-based approaches can automatically divide data into groups without specifying the exact mapping to the feature space. However, for estimation and prediction tasks, proper encoding/decoding procedures are needed. A similar idea applies to reinforcement learning. As a semi-supervised learning scheme, the subject learns continuously by taking actions and adjusting the acting rules (“policies”) based on the evaluation of the feedback (“rewards”). To be implementable for action evaluation in a limited period, the action space should usually be spanned by finite elements. A typical example is the application of collaborative robot control ["
                  - link "Reference 64" [ref=f4e336] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR64
                    - text: "64"
                  - text: "]."
                - paragraph [ref=f4e337]:
                  - text: To deal with highly complex problems and discover insights from extensive data collections, deep structures are necessary [
                  - link "65" [ref=f4e338] [cursor=pointer]:
                    - /url: "#ref-CR65"
                  - text: ","
                  - link "66" [ref=f4e339] [cursor=pointer]:
                    - /url: "#ref-CR66"
                  - text: ","
                  - link "Reference 67" [ref=f4e340] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR67
                    - text: "67"
                  - text: "]. In one aspect, by specifying the neural network model structure, a set of functions are parameterized. As a result, the upper limit of learnability has been decided. As an extreme example, any instance from the set of all linear functions can never describe a quadratic relationship regardless of what parameters are chosen. Therefore, it is promising that deep structures can capture more complex nonlinear relations between the inputs and the outputs than shallow and flat structures, given the same number of neutrons. [Some successful examples with deep structures: GoogLeNet (22 layers), AlphaGo (40 layers), etc.]. In another aspect, the learned weights determine which single function from the set can minimize the loss function, whereas how well they are learned determines the upper limit of performance (such as precision, robustness, confusion matrix, etc.). DL has shown strength in dealing with unstructured data, such as a piece of experience, a specific scenario, or skills transferred from other activities. The inputs can be anything that is properly encoded, e.g., an image, a video clip, a sound wave, texts, or readouts from various sensors. At the stage of problem formulation, rules are established to transform unstructured data into structured ones. The outputs can be indicators taken from a finite set of predefined categories (for classification tasks) or instances of variables that have an infinite number of values (for prediction tasks)."
                - paragraph [ref=f4e341]: In terms of algorithmic development, several researchers (including us) have experimented with techniques from a wide spectrum, ranging from (pure) knowledge-driven solutions to data-driven approaches, more recently expanding the range to include the ML/DL-based techniques with supports of big data and knowledge-based work automation techniques. It can be stated that helpful knowledge is scattered and dispersed in a wide range of raw data or information fragmentation. The challenge is to mine the evidence hidden in hard-to-notice details, so logical reasoning/deduction and subtle attention to the critical aspects based on the subconscious or experience are needed on the ML/DL technical route. Regarding the wide acceptance of such a research route, mainstream research fields include computer vision and pattern recognition, robotics and automation, natural language processing (considered to be the holy grail of AI), knowledge discovery and data mining, strategy- and decision-making, and so forth.
                - heading "3.2 Artificial narrow intelligence (ANI)" [level=3] [ref=f4e342]
                - paragraph [ref=f4e343]:
                  - text: The application of AI techniques has penetrated our daily lives [
                  - link "Reference 68" [ref=f4e344] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR68
                    - text: "68"
                  - text: "]. Most of the existing AI systems are dedicatedly designed for a limited range of predefined tasks. In this context, they are called artificial narrow intelligence (ANI) or weak AI. When we need to go to someplace but do not know the route, all we need is to specify the destination address to the Map apps on the smartphones, and it will provide a list of optimized path planning solutions that minimize the traveling time or cost. When we want to acquire information from the Internet, the search engine does most of the preliminary information collection job, including fine-targeted advertisement. Moreover, reliable real-time bioinformatics analysis has enabled novel means of personal identification, and as a result, novel means of payment based on fingerprints and face recognition become possible. Many ANI applications do not require globally optimal solutions, which are always challenging to resolve with formal approaches. Therefore, heuristic approaches have been widely studied as time-feasible alternatives. For safety–critical/security-critical systems, compromising optimality and achieving a theoretically guaranteed minimum performance by constraining the solution space is favorable. In recent years, quantum mechanics have been suggested to be a promising technology for cyber-security ["
                  - link "Reference 69" [ref=f4e345] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR69
                    - text: "69"
                  - text: ","
                  - link "Reference 70" [ref=f4e346] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR70
                    - text: "70"
                  - text: "]. In August 2016, Chinese scientists launched the first-ever quantum communication satellite. The maturation of the new generation of communication and computing techniques like quantum transmission and quantum computation may establish a new norm in the AI-embedded ecosystems."
                - paragraph [ref=f4e347]:
                  - text: In the domain of knowledge work automation, ANI systems have widely been applied to Q&A robots, serving banks, airline hotlines, and online consultation [
                  - link "Reference 71" [ref=f4e348] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR71
                    - text: "71"
                  - text: "]. The key feature of these applications is a precise categorization of the domain knowledge and a minimal range of frequently asked questions. From a domain-specific perspective, ANI tools have been or are being developed for education, medication, transportation, marketing, and game production ["
                  - link "72" [ref=f4e349] [cursor=pointer]:
                    - /url: "#ref-CR72"
                  - text: ","
                  - link "73" [ref=f4e350] [cursor=pointer]:
                    - /url: "#ref-CR73"
                  - text: ","
                  - link "74" [ref=f4e351] [cursor=pointer]:
                    - /url: "#ref-CR74"
                  - text: ","
                  - link "75" [ref=f4e352] [cursor=pointer]:
                    - /url: "#ref-CR75"
                  - text: ","
                  - link "Reference 76" [ref=f4e353] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR76
                    - text: "76"
                  - text: "]. By contrast, ANI becomes insufficient for highly complex tasks such as the optimization problems for process industry and would lead to unsatisfactory performance in terms of decision-making. The main challenge lies in how to connect the engineering operations limited by the physical laws (objective factors) to human experience and to the socio-economic factors (subjective factors). This requires a set of ANI systems, working jointly for the same target. In this sense, the ability of ANI is constrained to problem solving rather than problem definition and resource exploitation, thus in essence, dependent on how well the problems can be defined by humans."
                - heading "3.3 Autonomous systems" [level=3] [ref=f4e354]
                - paragraph [ref=f4e355]:
                  - text: An autonomous system is a group of components forming a unified whole with the power of acting independently from the external environment [
                  - link "Reference 77" [ref=f4e356] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR77
                    - text: "77"
                  - text: ","
                  - link "Reference 78" [ref=f4e357] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR78
                    - text: "78"
                  - text: "]. Today, autonomous vehicles and autonomous drones have become typical applications of such. They are targeted to perceive the surroundings, get aware of the real-time status, make plans and decisions, and take actions, all of which are achieved by onboard devices and/or with the aid of resources on the cloud and the edge side, with little human intervention. It is not difficult to find that these behaviors are driven by human-like problem solving and learning abilities, which are the backbones for any autonomous system. In case of emergency, there can be human instruction override for vehicles and drones. However, it is not always feasible in extreme environments such as for deep space and deep-sea exploration. The time delay of information transmission becomes significant, considering the long distances. Therefore, a robust autonomous system needs self-diagnosis and self-restoration capabilities ["
                  - link "Reference 79" [ref=f4e358] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR79
                    - text: "79"
                  - text: "]."
                - paragraph [ref=f4e359]:
                  - text: In another aspect, autonomous learning is necessary for generic AI systems. The learning ability determines how in the long-term the autonomous system self-evolves. On the opposite side of natural beings, most of the engineered autonomous systems have fixed functionality sets that usually cannot be expanded once constructed. It should be noted that not all the learning-based approaches enable autonomous learning abilities. The point lies in whether they are used for offline model training only or for online updates as well. The latter is also referred to as life-long learning. Training with positive examples, commonly understood as teaching and practicing, is a means for learning in the narrow sense. Beyond it, ability migration (transfer learning), critical thinking (adversarial training), imitation (imitation learning), and creativity (heuristic design) have begun to be proven as alternative effective technical routes for AI design [
                  - link "Reference 80" [ref=f4e360] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR80
                    - text: "80"
                  - text: ","
                  - link "Reference 81" [ref=f4e361] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR81
                    - text: "81"
                  - text: "]."
                - paragraph [ref=f4e362]:
                  - text: Knowledge, information, and data compose the fuel of the learners. Knowledge describes regular patterns and abstract facts that human understands. Therefore, it is usually semantic and embedded in books and research articles. To be interpretable and useful for machines, it needs to be modelled, transformed, and generated, which corresponds to the tasks of knowledge representation, knowledge reasoning, and knowledge discovery. Information is transmissible content that has timeliness, such as news and contextual data flow. The backbone of the contemporary industrial revolution—the cyber-physical systems (CPSs)—bridges the virtual space and physical space by establishing automatic flow of information and knowledge. In such context, the entities of autonomous systems can maintain digital replicas (digital twins, DT) that evolve along with real-time flow of information/data. The entities and the corresponding digital replicas form a conjugate pair to deal with the real-world complexity and uncertainty [
                  - link "Reference 82" [ref=f4e363] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR82
                    - text: "82"
                  - text: ","
                  - link "Reference 83" [ref=f4e364] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR83
                    - text: "83"
                  - text: "]. In the future, the digital replica may eventually become a feature subset of the physical entities. Furthermore, subsystems and submodules in the autonomous system can be linked to the knowledgebase and information flow of the entire fleet of assets, combining workflows in a novel closed-loop manner. It is worth to note that the R&D activities on closed-loop empowerment systems based on CPS/DT are still ongoing ["
                  - link "Reference 84" [ref=f4e365] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR84
                    - text: "84"
                  - text: "]. A few industrial examples are introduced in ["
                  - link "Reference 83" [ref=f4e366] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR83
                    - text: "83"
                  - text: "] and the references therein."
                - heading "3.4 Symbiotic systems and human-in-the-loop systems" [level=3] [ref=f4e367]
                - paragraph [ref=f4e368]: While the AI systems of today have outperformed humans only in a limited range of highly specific tasks, there are still risks and concerns about a future when humans must co-exist with novel forms of AI systems. It may not be too early to start thinking about the role of and the relationship between the human and the machines with intelligence.
                - paragraph [ref=f4e369]: Human-AI symbiotes are considered as a possible form of harmonic co-existence of human beings and AI. With the aid of the brain-machine interfaces (BMIs), AI acts as a kind of digital expansion of the central nervous systems. In such context, the boundary of the biological and the artificial minds is blurred. There may also be drastic changes in the way how we communicate with each other and interact with machines, as information exchange is more efficient via nerve (bio)electric signals alone than using the nerve signals to drive the muscles to generate different facial expressions, voices, postures, or gestures. To this end, there need to be strong connections between the AI systems by human minds and vice versa. Today, fundamental works are being carried out.
                - paragraph [ref=f4e370]:
                  - text: According to the forms of information representation, machines can receive human instructions by means of bio-signal recognition and behavior recognition. The former takes EEG (electroencephalography) signals, thermal signals, and even chemical signals and interprets them using signal processing/pattern recognition approaches. The latter takes optical signals and audio signals and interprets them with machine vision techniques and speech recognition techniques. Beyond all these, people today spend much time in living a digital life and are equipped with numerous electronic devices. The information uploaded to various apps is useful for creating digital profiles. For instance, personal social media networks characterize daily behavior and interpersonal relationship while the real-time public medical data can reflect the epidemic situation [
                  - link "85" [ref=f4e371] [cursor=pointer]:
                    - /url: "#ref-CR85"
                  - text: ","
                  - link "86" [ref=f4e372] [cursor=pointer]:
                    - /url: "#ref-CR86"
                  - text: ","
                  - link "Reference 87" [ref=f4e373] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR87
                    - text: "87"
                  - text: "]. Smart phones, smart glasses, tablets, and so forth act as auxiliary interfaces to monitor and influence human behavior ["
                  - link "Reference 88" [ref=f4e374] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR88
                    - text: "88"
                  - text: "]."
                - paragraph [ref=f4e375]:
                  - text: Regarding the implementation solutions that bridge human minds and AI, further advancements in BMI (or brain-computer interface, BCI) technologies are necessary [
                  - link "Reference 89" [ref=f4e376] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR89
                    - text: "89"
                  - text: "]. The main tasks include capturing, amplifying, analyzing, and interpreting the brain wave signals, and based on which to control the connected machines/computers. The success necessitates interdisciplinary research, covering neuroscience, data science (signal processing and machine learning), as well as communication and sensing technologies ["
                  - link "Reference 90" [ref=f4e377] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR90
                    - text: "90"
                  - text: "]. In the laboratory environment, researchers have managed to achieve non-invasive implementation for writing and spelling ["
                  - link "Reference 91" [ref=f4e378] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR91
                    - text: "91"
                  - text: ","
                  - link "Reference 92" [ref=f4e379] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR92
                    - text: "92"
                  - text: "], prosthetic/exoskeleton control ["
                  - link "Reference 93" [ref=f4e380] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR93
                    - text: "93"
                  - text: "], and for general-purpose communication ["
                  - link "Reference 94" [ref=f4e381] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR94
                    - text: "94"
                  - text: "]. By contrast, the invasive BMI techniques with electrodes in the brain can achieve better performance in control precision and are more suitable for real-time applications. Additional advancements in the study of brain functions and the development of nanomaterial and implant surgery techniques are necessary for implementations on a broader scale ["
                  - link "Reference 95" [ref=f4e382] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR95
                    - text: "95"
                  - text: ","
                  - link "Reference 96" [ref=f4e383] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR96
                    - text: "96"
                  - text: "]. It is also worth noting that the state-of-the-art practice is still limited to open-loop control and unidirectional information flow, from humans’ brains to computers. This is more due to ethical concerns than technical feasibility, as experiments with animals have demonstrated the effectiveness of artificial stimuli to control visual and motion perceptions ["
                  - link "Reference 97" [ref=f4e384] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR97
                    - text: "97"
                  - text: "]."
                - paragraph [ref=f4e385]:
                  - text: With the establishment of effective links, demand-driven application scenarios that benefit from the symbiotic ecosystem have started to surface. Over the past decade, human-in-the-loop (HITL) systems have become a mainstream research subject that addresses the issues regarding modeling and predicting human-related factors so that they can be treated as a part of closed-loop systems. On the opposite side of the industrial practice that treats human participants as unfavorable factors [
                  - link "Reference 98" [ref=f4e386] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR98
                    - text: "98"
                  - text: "] and pursues unmanned working conditions with high automation degrees, the main challenge lies in dealing with the uncertainties introduced by the human participants. While it is still impractical to interpret human thinking in real-time, AI may identify the intention by observing our status and behavior, by learning from the changes made to the environment with which we are interacting, or by learning from how we react to previous cases."
                - paragraph [ref=f4e387]:
                  - text: HITL technology plays an essential role in training, design, operation, and optimization [
                  - link "99" [ref=f4e388] [cursor=pointer]:
                    - /url: "#ref-CR99"
                  - text: ","
                  - link "100" [ref=f4e389] [cursor=pointer]:
                    - /url: "#ref-CR100"
                  - text: ","
                  - link "Reference 101" [ref=f4e390] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR101
                    - text: "101"
                  - text: "]. For instance, pilots are taught on flight training simulators (FTS) where the flight environment is adaptively adjusted and rendered by AI. Similarly, surgeons and dentists can carry out virtual surgeries as a part of training or strategy-making before actual medical activities. As for designation, AI creates groups of (digital) prototypes as candidate product solutions and constantly interacts with the designers or the customers to meet personalized requirements, in a parallel, case-specific, and efficient manner. In industrial assembly processes, smart robots or those known as collaborative robots help human operators (and vice versa) to manipulate tools and give warnings and suggestions ["
                  - link "Reference 102" [ref=f4e391] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR102
                    - text: "102"
                  - text: ","
                  - link "Reference 103" [ref=f4e392] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR103
                    - text: "103"
                  - text: "]. An autonomous driving system and advanced driving assistant system (ADAS) monitor the traffic condition and free the human drivers from intensive attention. Furthermore, with HITL optimization techniques, AI systems can reduce the conservativeness in making recommendations. They focus on the best options and are not concerned about outrageous ones because the human judges will filter them out. Based on these examples, it can be summarized that both humans and AI interact with the environment, perceiving the states and making corresponding decisions and changes. From the perspective of systems and control, there are two controllers in the same closed-loop, driven by the biological and the artificial brains. In this sense, to ensure overall stability and achieve good performance, understanding and predicting human actions is no less important than designing explainable AI. The attractive part is that humans excel at leveraging unstructured data while machines outperform at analyzing structured data, forming a natural complement."
                - paragraph [ref=f4e393]:
                  - text: In the long term, there are several advantages if human-AI symbiotic systems become more communal. In one aspect, symbiotic systems may ensure that the intelligence level is improved in a balanced and controllable manner. No individuals or some groups of individuals hold monopolistic information resources in all domains so that AI dictators or human dictators powered by super-AI might be avoided. In the meantime, the competence in humans and AI is concerted to a collaborative relationship [
                  - link "Reference 104" [ref=f4e394] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR104
                    - text: "104"
                  - text: "]. Additionally, the openness and transparency of AI development can be maintained over the process of establishing a symbiotic ecosystem. It relies on interpretable operation mechanisms and explainable AI (XAI), helping us to understand from the AI’s perspective how a problem/task is defined, what information sources are needed, how to exploit knowledge from big data, what factors are taken into consideration, which solution is adopted to solve the problem, and eventually, how a decision or a prediction is made. Furthermore, the in-depth integration with AI systems may unleash the potential of the human brain and elevate overall social efficiency. The limitations in information availability and computing capability might be eliminated. Instead, the bottleneck would lie in creativity, horizons, and non-renewable resources."
                - heading "3.5 Driving forces of AI development" [level=3] [ref=f4e395]
                - paragraph [ref=f4e396]:
                  - text: An increase in the bulk of subjects facilitates the AI R&D ecosystem and the related ecology. In the short term, the development of AI is to a large extent driven by dominant stakeholders, especially with support from major investments and governmental strategic planning [
                  - link "Reference 3" [ref=f4e397] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR3
                    - text: "3"
                  - text: ","
                  - link "Reference 68" [ref=f4e398] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR68
                    - text: "68"
                  - text: "]. The key lies in whether the novel technologies can be grounded swiftly, contributing to economic harvest and regional/social stability. On the other hand, learning from the historical experience of “AI winters”, it is still uncertain and indirect that whether, in the mid to long term, AI development will converge to the basic demands of the general public, for improving the quality of life, the efficiency of working, and the degree of happiness."
                - paragraph [ref=f4e399]:
                  - text: The healthcare industry covers all the attributes from patients to doctors, from platform to end users, from groups to individuals [
                  - link "Reference 105" [ref=f4e400] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR105
                    - text: "105"
                  - text: "]. The industrial chain is constituted of medicinal materials, medicine, medical instruments, medical institutions, medical information, and medical examination. Today, healthcare applications are acting as an active driving force of AI development. Colossal amounts of medical data are collected every day. The complexity of medical information lies in the high dimensionality, nonlinearity, and sometimes strong dynamics. In this context, the AI-powered diagnosis systems need to be well-trained to achieve an acceptable performance, which usually consists of a list of indicators such as those characterizing the prediction accuracy and the confusion matrix that characterizes the classification performance."
                - paragraph [ref=f4e401]:
                  - text: AI plays a key role in establishing novel norms of modern hospitals towards one-stop medical services and new business models. In the future, the allocation of limited medical resources will still be the major issue. In the cases where the physicians require reliable intelligent preprocessing tools to reduce their workload in dealing with raw data, AI may act as a good assistant. For instance, AI helps to markup suspicious lesion areas on optical images [
                  - link "Reference 106" [ref=f4e402] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR106
                    - text: "106"
                  - text: "], X-ray images ["
                  - link "Reference 107" [ref=f4e403] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR107
                    - text: "107"
                  - text: "], or magnetic resonance images ["
                  - link "108" [ref=f4e404] [cursor=pointer]:
                    - /url: "#ref-CR108"
                  - text: ","
                  - link "109" [ref=f4e405] [cursor=pointer]:
                    - /url: "#ref-CR109"
                  - text: ","
                  - link "Reference 110" [ref=f4e406] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR110
                    - text: "110"
                  - text: "], and can analyze patients’ speech to diagnose Alzheimer’s disease ["
                  - link "Reference 111" [ref=f4e407] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR111
                    - text: "111"
                  - text: "]. Researchers also put hope on shortening the cycle of new drug discovery with the ability of AI in learning from vast volumes of medical literature and datasets ["
                  - link "112" [ref=f4e408] [cursor=pointer]:
                    - /url: "#ref-CR112"
                  - text: ","
                  - link "113" [ref=f4e409] [cursor=pointer]:
                    - /url: "#ref-CR113"
                  - text: ","
                  - link "114" [ref=f4e410] [cursor=pointer]:
                    - /url: "#ref-CR114"
                  - text: ","
                  - link "Reference 115" [ref=f4e411] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR115
                    - text: "115"
                  - text: "]. Furthermore, embedding AI systems in portable devices will help reduce the shortage of medical resources in remote areas and reduce social inequality. Motivated by these practical demands, there are huge driving forces in the AI-related R&D activities, the production, and the applications of AI-embedded devices, as well as the construction of intelligent platforms and infrastructure. Currently, AI has improved the medical automation, but is mainly used to aid diagnosis. Using AI alone as the backbone of healthcare is very dangerous. In 2015, IBM launched Watson Health, a business unit that uses AI to solve critical problems in healthcare. Their algorithms prescribe drugs with severe side effects and even death to a cancer patient."
                - paragraph [ref=f4e412]:
                  - text: Another driving force behind the advancement of AI is related to intelligent transportation applications. Research on autonomous vehicles has been an extremely popular direction. The tasks cover all aspects from perception to decision making, which are all considered to be in need of intelligence [
                  - link "Reference 116" [ref=f4e413] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR116
                    - text: "116"
                  - text: "]. Delightfully, what were considered as challenging problems have now applicable approaches, such as localization, object recognition, and tracking, movement prediction, and path planning ["
                  - link "Reference 117" [ref=f4e414] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR117
                    - text: "117"
                  - text: "]. Although these are ANI tasks, the high demands in dealing with the complexity and uncertainty in the real-world environment and the requirements of real-time and onboard implementation are boosting the AI industry. From the viewpoint of commercialization, it is hard to tell whether the traditional automotive companies or the Internet enterprises dedicated to intelligent solutions will be dominating the innovation and the market of smart automobiles. From another perspective, vehicular cyber-physical systems are being studied to connect the information islands of each individual transportation participants ["
                  - link "Reference 118" [ref=f4e415] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR118
                    - text: "118"
                  - text: "]. The models of the real-time regional traffic network can be created with the aid of the cloud computing resources and based on the publicly available information collected from distributed agents (such as vehicle sensors, pedestrians’ smart phones, and roadside infrastructure). On this basis, intelligent algorithms are required to play the role from a macroscopic perspective, for instance, in the prediction and optimal diversion of the traffic. Today, policies are put forward to provide support for promoting intelligent transportation applications and to provide regulations for testing activities and open test roads."
                - paragraph [ref=f4e416]:
                  - text: In addition to the above, wide categories of simulation applications are relying on and in turn driving the development of AI. The typical application scenarios range from manufacturing to education, from smart city to entertainment, and many more beyond [
                  - link "119" [ref=f4e417] [cursor=pointer]:
                    - /url: "#ref-CR119"
                  - text: ","
                  - link "120" [ref=f4e418] [cursor=pointer]:
                    - /url: "#ref-CR120"
                  - text: ","
                  - link "Reference 121" [ref=f4e419] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR121
                    - text: "121"
                  - text: "]. The enabling technologies include but are not limited to Internet of things, extended reality (XR), digital twin, robots, smart grids, space technologies, and so forth. In comparison with the AI winters, the historical period of the twenty-first century is full of opportunities, grasping which will lead us to a prosperous future where AI can create values and benefit human lives to the greatest extent."
            - generic [ref=f4e421]:
              - heading "4 Future" [level=2] [ref=f4e422]
              - generic [ref=f4e423]:
                - heading "4.1 Understanding and cognition" [level=3] [ref=f4e424]
                - paragraph [ref=f4e425]:
                  - text: While AI systems are created by humans, they may evolve in a much faster speed than anticipated and develop high complexity in structure, behavior, and decisions that humans can hardly follow. In the long term, AI systems and human beings need to establish common cognitions in terms of the outlook on the world, life, and values. However, to date, engineered systems cannot be modelled to precisely replicate the real-world entities and the physical environment. That is why a bridge to connect the cyber and the physical worlds is being built in the Industry 4.0 era, hoping to feed the engineered digital replicas with online real-time measurements (for synchronization, correction, and update) and further why Kalman filter is regarded as a cornerstone technique in the domains of sensing/perception/control due to its ability to achieve optimal estimation by compromising measurements (with inevitable error) and model outputs [
                  - link "Reference 122" [ref=f4e426] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR122
                    - text: "122"
                  - text: ","
                  - link "Reference 123" [ref=f4e427] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR123
                    - text: "123"
                  - text: "]."
                - paragraph [ref=f4e428]:
                  - text: As discussed in Sect.
                  - link "3.4" [ref=f4e429] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Sec10
                  - text: ", AI will play important roles in symbiotic systems in the future. In the narrow sense, human–machine symbiotes would bring benefits in terms of overcoming disabilities or making humans stronger (also referred to as “human augmentation”) and getting more knowledgeable. Especially, in an age of information explosion, it has become increasingly difficult to search through the available resources. Yet, a type of cognitive digital twin (CDT) may be very helpful to collect and pre-screen the related data, and then to perform tasks on behalf of human. An illustrative example of “Google Duplex” was given in Table"
                  - link "1" [ref=f4e430] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Tab1
                  - text: where AI made phone calls to book a restaurant. With the grounded applications of natural language processing and computer vision, CDT may execute users’ much complex demands. Customized optimization is feasible by integrating the knowledge structure of an individual, and it is actually an ongoing research which is usually referred to as personal CDT. In turn, the knowledge structure and the practical skills of humans could be improved in a targeted manner by using courses suggested by AI (just like what was envisioned in the movie The Matrix). Similarly, in the future, scientists could manage the explosion of knowledge better with the aid of machine reading to discover new knowledge that they need most from hundreds of thousands of publications each year.
                - paragraph [ref=f4e431]:
                  - text: We see that there are plenty of AI algorithms inspired by the nature, such as the grey wolf algorithm, ant colony optimization, particle swarm, genetic algorithm, and so forth. Neural networks are inspired by biological nerve systems. Nevertheless, the models have been much simplified, and as a result, the mechanisms of learning and acting become different and divergent that the AI systems can hardly understand the nature and the socio-economic worlds like we do. In the future, with super large-scale neural networks such as Wu Dao 2.0 and GPT-3 becoming common, it may be expected that multimodality across the major branches of AI such as computer vision and natural language processing will end up unified [
                  - link "Reference 124" [ref=f4e432] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR124
                    - text: "124"
                  - text: "]."
                - paragraph [ref=f4e433]:
                  - text: On the other hand, can humans understand the behavior of AI systems and trust their decisions? As aforementioned, XAI (or interpretable AI) is the key towards extensive and generic application of AI systems for reliability-critical tasks. Theoretical guarantee is needed in terms of why it works and what the target is [
                  - link "125" [ref=f4e434] [cursor=pointer]:
                    - /url: "#ref-CR125"
                  - text: ","
                  - link "126" [ref=f4e435] [cursor=pointer]:
                    - /url: "#ref-CR126"
                  - text: ","
                  - link "127" [ref=f4e436] [cursor=pointer]:
                    - /url: "#ref-CR127"
                  - text: ","
                  - link "Reference 128" [ref=f4e437] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR128
                    - text: "128"
                  - text: "]."
                - paragraph [ref=f4e438]:
                  - text: The research on XAI can take two routes. First, AI systems are designed as equivalent or approximate solutions to the conventional non-AI solutions with clear physical meanings. In this way, it is clear what the design target is and what exactly is to be learned, and the heavy dependency on trial-and-error during the design phase can be reduced by learning from data. For instance, the “kernel trick” is usually used to simplify the computation of the inner product of nonlinear functions which map low-dimensional inseparable variables to a high-dimensional separable feature space. The problem is that there has been no consensus reached on how to optimally select the type and how to set the parameters of the kernel function, and the online computational load is quite high. As a result, although the performance is satisfactory and sometimes superior, kernel-based methods are facing great challenges in practical real-time applications. Promisingly, Deep Neural Network (DNN) training enables automating the process of manual tuning of critical parameters in these conventional solutions. The theoretical support is provided by Mercer’s Theorem, which proves that any semi-positive function is a valid candidate. Therefore, by using DNN, it can achieve a learnable and faster realization of the kernel function where the explicit form and the coefficients of the nonlinear mapping function can be obtained [
                  - link "Reference 129" [ref=f4e439] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR129
                    - text: "129"
                  - text: ","
                  - link "Reference 130" [ref=f4e440] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR130
                    - text: "130"
                  - text: "]. Nevertheless, it is worth noting that the learned functions based on DNN vary greatly during each training epoch."
                - paragraph [ref=f4e441]:
                  - text: Second, efforts are dedicated to the study of the characteristics of the AI models to derive human-understandable logic. This can be straightforwardly achieved for knowledge-based AI systems. Otherwise, XAI needs to answer questions including (i) which factors/data contributes most to the results and (ii) how to interpret results using linguistic expressions. As for question (i), just-in-time learning, locally weighted projection regression, and K-nearest neighboring-based methods are typical examples that link decision-making directly to the related data/local models [
                  - link "131" [ref=f4e442] [cursor=pointer]:
                    - /url: "#ref-CR131"
                  - text: ","
                  - link "132" [ref=f4e443] [cursor=pointer]:
                    - /url: "#ref-CR132"
                  - text: ","
                  - link "133" [ref=f4e444] [cursor=pointer]:
                    - /url: "#ref-CR133"
                  - text: ","
                  - link "134" [ref=f4e445] [cursor=pointer]:
                    - /url: "#ref-CR134"
                  - text: ","
                  - link "Reference 135" [ref=f4e446] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR135
                    - text: "135"
                  - text: "]. As for question (ii), temporal logic-based methods are promising solutions ["
                  - link "Reference 136" [ref=f4e447] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR136
                    - text: "136"
                  - text: "]. Furthermore, as for the “black-box/grey-box” models, the work is to shed light on the characteristics of the sub-blocks of the deep structures ["
                  - link "Reference 137" [ref=f4e448] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR137
                    - text: "137"
                  - text: "]. Ablation experiments analyze the necessity of each module and the influence on the overall performance ["
                  - link "Reference 138" [ref=f4e449] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR138
                    - text: "138"
                  - text: "]. In addition to the theoretical perspective, explainability also needs to be discussed along with the specific application background. Some tasks require robust performance against data changes, e.g., having good tolerance to disturbance, noise, missing values, and outliers, while the others require high sensitivity to abnormal changes ["
                  - link "139" [ref=f4e450] [cursor=pointer]:
                    - /url: "#ref-CR139"
                  - text: ","
                  - link "140" [ref=f4e451] [cursor=pointer]:
                    - /url: "#ref-CR140"
                  - text: ","
                  - link "Reference 141" [ref=f4e452] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR141
                    - text: "141"
                  - text: "]."
                - paragraph [ref=f4e453]: If confusing advice is provided by an AI and unfortunately it cannot be fully interpreted, shall we trust it? For many decision-making processes, there is no right or wrong, but a series of strategic moves are favorable in the long run. However, it is very subtle what factors are taken into consideration and how much weight is assigned to each factor. For instance, for a dying patient, shall we take every chance to extend his/her life regardless of the suffering or turn to terminal care. In addition to facts and targets, the implicit and uncertain factors may play a decisive role. The point is that we may always have a question mark in our hearts when dealing with human-involved issues because machines can hardly cognize and have emotion as we do. Even though the decisions can be interpreted by following the second XAI research route, for such cases, AI systems can be only used as a supervisory tool. “All models are wrong, but some are useful.” In this sense, to be compatible with basic laws and regulations, we may trust the AI behaviors, but the responsibility shall always be linked to a person.
                - heading "4.2 Artificial general intelligence (AGI)" [level=3] [ref=f4e454]
                - paragraph [ref=f4e455]:
                  - text: ANI systems are characterized by a limited range of well-defined intelligence-related functionalities. The design is therefore also highly specialized. In such context, the advancement in the ANI techniques is accompanied by the awareness of the significance in the correct formulation (well-posedness) of the problem and proper definition of targets (“be careful of what we wish for”). Nevertheless, it will not always be like this. The relationship between AI and humans is likely to change in the long term. As shown in Fig.
                  - link "3" [ref=f4e456] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Fig3
                  - text: ", at stage I of AI, i.e., ANI (the current era), humans create AI systems and use them as tools. At stage II of AI, i.e., Artificial General Intelligence (AGI), humans interact with AI systems and treat them as omnipotent helpers. At stage III, named Artificial Super-Intelligence (ASI), AI may be able to create better AI systems than humans, in which sense they may be considered a novel form of life. The coming of stage III is also considered as a singularity in the development of AI (see Sect."
                  - link "4.3" [ref=f4e457] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Sec15
                  - text: ).
                - figure "Fig. 3" [ref=f4e459]:
                  - generic [ref=f4e462]:
                    - generic [ref=f4e463]:
                      - img "Fig. 3" [ref=f4e465]
                      - link "Full size image figure 3" [ref=f4e467] [cursor=pointer]:
                        - /url: /article/10.1007/s44163-022-00022-8/figures/3
                        - text: Full size image
                    - paragraph [ref=f4e471]: Looking to the long-term future
                - paragraph [ref=f4e472]:
                  - text: "As pointed out by Professor Stuart Russell, the field has operated for over 50 years on one simple assumption: the more intelligent, the better ["
                  - link "Reference 142" [ref=f4e473] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR142
                    - text: "142"
                  - text: "]. Yet, unconstrained success brings huge risks and huge benefits. Beyond the degree of intelligence that AI systems can reach, the discussion of which belongs to the technical dimension in the development of AI, more attention is needed on the socioeconomic factors. In fact, new challenges are already here today, such as trustworthiness, privacy-preserving, cyber-security, social equality, policy and law, education, and employment, and so forth."
                - paragraph [ref=f4e474]:
                  - text: In our society, each occupation corresponds to a group of people and many more related to them. Today, the skills required by the train or the subway operators have changed. In the past, a considerable amount of time was devoted to training on how to manipulate vehicles, whereas nowadays the focus is on emergency events when human decisions override computer instructions. Likewise, in the aviation industry, it is a common practice for pilots to take over control during take-offs and landings because there are so many uncertainties that require human judgment. Not doing so may lead to not only safety risks but also critical ethical and law issues in case of accidents. Such risks are currently unacceptable because AI has not yet gained the trust that it can act more rationally and judiciously under all circumstances. It is also important to be able to know on what factors a decision was based upon so that a correct interpretation of it can be made. Such issues have formed a subtopic of research, called Explainable AI (XAI). The goal is to understand how AI functions, such as what factors and logic are adopted when outputting a decision. This would contribute significantly to the establishment of a formal science (compared against heuristic learning) that would enable a methodology for systematic analysis and theoretically guaranteed performance. The subject has still not matured enough in policy and law aspects to enable us to reach a justifiable decision on who should take the responsibility for errors and failures related to AI systems [
                  - link "Reference 143" [ref=f4e475] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR143
                    - text: "143"
                  - text: "]."
                - heading "4.3 Singularity and artificial super intelligence (ASI)" [level=3] [ref=f4e476]
                - paragraph [ref=f4e477]:
                  - text: It was about 15 years ago, in 2005, that a non-fiction book, titled “Singularity is Near” was published and soon became very popular [
                  - link "Reference 144" [ref=f4e478] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#ref-CR144
                    - text: "144"
                  - text: "]. Its author: the futurist Ray Kurzweil, defined technological singularity as “a time when machines will have and be able to make other machines with intelligence comparable to human beings.” His prediction at that time was that this would happen by 2045, i.e., about 25 years later. In more general terms, singularity is a status that separates quantitative and qualitative changes in the process of AI development. In the context of this paper, singularity refers to the time when AI has the ability to design AGI systems better than humans. In addition to its supercomputing ability, AI outperforms mankind in learning, prediction, creativity, productivity, decision-making, organization, management, as well as survival. If the narrow understanding of learning is limited to the algorithmic/software level (which is the case for today), we need to note that post-singularity AI systems may have the ability to reprogram the firmware and even to design hardware by itself, starting from scratch. This is a domain (rebuild our brains) that humans can hardly reach at present and it is uncertain whether human can achieve it in the future. Besides, post-singularity AI can be smart enough to guarantee the supply of resources while figuring out a way for sustainable development. From then onwards, the evolutionary process of AI is dominated by itself, towards an unpredictable direction with an unimaginable speed."
                - paragraph [ref=f4e479]: Singularity is a subtle borderline, crossing which the AI systems become out of human control. It is well acknowledged that beings with the highest level of intelligence live at the top of the food chain. Nevertheless, although there is no evidence that silicon-based being can exist at all, there is neither proof that silicon cannot develop novel forms of intelligence as carbon-based creatures. With generation-by-generation iterations, there are chances that the capability of AI exceeds all humans in all aspects, which constitutes the definition of artificial super intelligence (ASI). ASI learn from experience, adapt to new situations, handle abstract concepts, and use knowledge to manipulate the surrounding environment. It can do everything (and does better) that humans can do—logic reasoning, thinking, creativity, strategy, learning a skill on its own, identifying knowledge resources on its own. Today, there is hardly any consensus reached whether such singularity exists and whether AGI is in the foreseeable future. Nevertheless, if there would be evidence of such, what is needed to prepare for it? We need to consider the means to steer the wheel in such a way that the probability of stepping into an unexpected and unfortunate future is minimized.
            - generic [ref=f4e481]:
              - heading "5 Concluding remarks" [level=2] [ref=f4e482]
              - generic [ref=f4e483]:
                - paragraph [ref=f4e484]:
                  - text: Profound technological changes have taken place around us during the last 2 decades, supported by disruptive advances both on the software and the hardware sides. The dominant feature of the changes is the integration of the virtual world with the physical world through the Internet of Things (IoT). The most recent development is the radical paradigm shift from “connected things” to “connected intelligence”. Table
                  - link "1" [ref=f4e485] [cursor=pointer]:
                    - /url: /article/10.1007/s44163-022-00022-8#Tab1
                  - text: tries to emphasize the accelerating nature of technological developments by listing the important milestones in AI during the last 25 years.
                - paragraph [ref=f4e486]: Throughout the history of scientific and technological development, the emergence of any scientific and technological revolution is not only reflected in technology, but also changes in human social structure, moral constraints, laws, and education. In this article, at the critical point of AI technological revolution, a brief history of AI development is presented, the advancement and the state-of-the-art of the AI discipline are reviewed, and a perspective on the future of AI is offered. AI integrates with a variety of disciplines, plays an important role in the history and might impact the future of humanity. Today, AI is more available now than ever. Products and services driven by AI technologies have widely emerged around us and have led to a profound impact on daily life. Predictably, AI will act as the one of the backbones of new technological revolutions. Nevertheless, several troughs may once again take place if the technologies/applications cannot be grounded swiftly according to the expectations from the dominant stakeholders (inventors rather than the general public). The article is intended to help the readers to better understand AI, accept AI, and think more deeply about AI. With the long-lasting curiosity and wisdom, we are likely to witness the beauty of a world with the novel AI ecology. As Ophelia stated in Shakespeare’s play Hamlet, “we know what we are, but we know not what we may become.”
