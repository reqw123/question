<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>desktop-pet 3D</title>
<!-- 3D 模型（光粒子，particle-effect/）專用的透明視窗。原本跟 Live2D 一起畫在 index.html，
     但那個視窗只蓋主螢幕；為了讓 3D 模型能跑到其他螢幕，main.js 另開這個蓋住「所有螢幕
     聯集範圍」的視窗專門畫 3D。Live2D 主視窗維持只蓋主螢幕（lib/live2d.js 的排版依視窗
     大小計算，視窗放大角色位置會跑掉），兩邊互不影響。 -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
</style>
</head>
<body>

<script>
  // 音效靜音/音量：particle-effect.js 的序列語音/BGM 原本在 index.html 裡被那邊的 Audio
  // 攔截器當成「閒置閒聊音效」管（預設靜音）。搬到這個視窗後沿用同一套規則——
  // main.js 在 index.html 的閒置閒聊音效開關/音量變動時呼叫 setParticleAudioSettings() 同步過來。
  var soundEnabled = false;
  var soundVolume = 1;
  var _allAudio = new Set();
  (function () {
    const _Orig = window.Audio;
    window.Audio = function (...args) {
      const a = new _Orig(...args);
      const apply = () => { a.muted = !soundEnabled; a.volume = soundVolume; };
      apply();
      _allAudio.add(a);
      a.addEventListener('ended', () => _allAudio.delete(a));
      a.addEventListener('play', () => { apply(); _allAudio.add(a); });
      return a;
    };
    window.Audio.prototype = _Orig.prototype;
  })();
  window.setParticleAudioSettings = function setParticleAudioSettings(enabled, volume) {
    soundEnabled = !!enabled;
    if (typeof volume === 'number') soundVolume = Math.min(1, Math.max(0, volume));
    _allAudio.forEach((a) => { a.muted = !soundEnabled; a.volume = soundVolume; });
    return true;
  };
</script>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module" src="particle-effect/particle-effect.js"></script>
</body>
</html>
