<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FBX 3D 模型與動畫預覽器</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Noto Sans TC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111827; color: #eef2ff; }
    #viewport { position: fixed; inset: 0; }
    #panel { position: fixed; top: 16px; left: 16px; width: min(350px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; padding: 16px; border: 1px solid #ffffff26; border-radius: 16px; background: #101827d9; backdrop-filter: blur(12px); box-shadow: 0 12px 45px #0006; transition: transform .25s ease; }
    #panelToggle { position: fixed; z-index: 4; top: 26px; left: min(366px, calc(100vw - 48px)); width: 32px; height: 52px; padding: 0; border-radius: 0 10px 10px 0; transition: left .25s ease; }
    body.panel-collapsed #panel { transform: translateX(calc(-100% - 20px)); } body.panel-collapsed #panelToggle { left: 0; }
    h1 { margin: 0 0 6px; font-size: 18px; } p { margin: 0 0 14px; color: #cbd5e1; font-size: 13px; line-height: 1.45; }
    .group { border-top: 1px solid #ffffff18; padding-top: 12px; margin-top: 12px; }
    label, .label { display: block; margin-bottom: 7px; font-size: 12px; color: #cbd5e1; }
    input, select, button, textarea { width: 100%; border: 1px solid #ffffff28; border-radius: 9px; background: #1e293b; color: inherit; padding: 9px 10px; font: inherit; }
    textarea { min-height: 300px; resize: vertical; line-height: 1.5; }
    button { cursor: pointer; background: #2563eb; border: 0; font-weight: 700; } button:hover { background: #3b82f6; } button:disabled { opacity: .45; cursor: not-allowed; }
    .hiddenFile { display: none; } #sourceStatus, #searchStatus { margin-top: 8px; color: #a5b4fc; font-size: 12px; white-space: pre-line; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    input[type="range"] { padding: 0; accent-color: #60a5fa; } input[type="color"] { height: 38px; padding: 3px; }
    #dropZone { position: fixed; inset: 0; display: none; place-items: center; z-index: 3; background: #0f172acc; border: 4px dashed #60a5fa; color: white; font-size: 22px; font-weight: 700; pointer-events: none; }
    #dropZone.show { display: grid; } #info { white-space: pre-line; min-height: 34px; font-size: 12px; color: #a5b4fc; }
    kbd { border: 1px solid #ffffff40; border-radius: 4px; padding: 1px 4px; }
  </style>
</head>
<body>
  <div id="viewport"></div><div id="dropZone">放開以載入 FBX 模型</div>
  <button id="panelToggle" aria-label="收納側邊欄" title="收納側邊欄">❮</button>
  <main id="panel">
    <h1>3D 模型預覽器</h1>
    <p>選取模型根資料夾後，可用 <kbd>↑</kbd><kbd>↓</kbd> 切換模型、<kbd>←</kbd><kbd>→</kbd> 切換動作。也可拖曳單一模型檔。</p>
    <div class="row"><button id="folderBtn">📁 選擇資料夾</button><button id="fileBtn">📄 選擇檔案</button></div>
    <input id="folderInput" class="hiddenFile" type="file" webkitdirectory directory multiple title="選取模型根資料夾" /><input id="fileInput" class="hiddenFile" type="file" accept=".fbx,.glb,.zip,model/fbx,model/gltf-binary,application/zip,application/x-zip-compressed" />
    <div id="sourceStatus">尚未選擇來源。</div>
    <section class="group"><label for="modelSelect">第一模型</label><select id="modelSelect" disabled><option>尚未選取模型資料夾</option></select><div id="modelNav" style="margin-top:8px">尚未選取模型資料夾。</div><label for="secondModelSelect" style="margin-top:12px">第二模型（並排比較）</label><select id="secondModelSelect" disabled><option>不顯示第二模型</option></select><button id="clearSecondBtn" disabled style="margin-top:8px">移除第二模型</button></section>
    <section class="group"><label for="searchQuery">搜尋模型或目前模型的動作</label><div class="row"><input id="searchQuery" type="search" placeholder="輸入關鍵字，例如 idle、attack" /><button id="searchBtn">搜尋</button></div><select id="searchResults" disabled style="margin-top:8px"><option>尚未搜尋</option></select><div id="searchStatus"></div></section>
    <section class="group">
      <span class="label">第一角色動畫</span><select id="clipSelect" disabled><option>尚未載入動畫</option></select>
      <div class="row3" style="margin-top:8px"><button id="playBtn" disabled>▶ 播放</button><button id="pauseBtn" disabled>❚❚ 暫停</button><button id="resetBtn" disabled>↺ 重播</button></div>
      <div class="row" style="margin-top:8px"><button id="sequenceBtn" disabled>▶ 全部動作</button><button id="copyNamesBtn" disabled>☰ 顯示動作標籤</button></div>
      <button id="snippetBtn" disabled style="margin-top:8px">{} 顯示動畫設定片段</button>
      <div id="namesPanel" hidden style="margin-top:8px"><label id="namesLabel" for="animationNames">可自行反白並複製</label><textarea id="animationNames" readonly spellcheck="false"></textarea></div>
      <div style="margin-top:10px"><label for="speed">播放速度 <span id="speedValue">1.0×</span></label><input id="speed" type="range" min="0" max="2" value="1" step="0.1" /></div>
    </section>
    <section class="group">
      <span class="label">第二角色動畫</span><select id="secondaryClipSelect" disabled><option>尚未載入第二角色動畫</option></select>
      <div class="row3" style="margin-top:8px"><button id="secondaryPlayBtn" disabled>▶ 播放</button><button id="secondaryPauseBtn" disabled>❚❚ 暫停</button><button id="secondaryResetBtn" disabled>↺ 重播</button></div>
    </section>
    <section class="group">
      <span class="label">背景與環境</span><div class="row"><select id="background"><option value="studio">工作室漸層</option><option value="sky">天空</option><option value="solid">純色</option><option value="transparent">透明背景</option></select><input id="bgColor" type="color" value="#111827" title="背景顏色" /></div>
      <div class="row" style="margin-top:8px"><button id="gridBtn">隱藏地面網格</button><button id="frameBtn">⌖ 置中模型</button></div>
    </section>
    <section class="group"><span class="label">視角控制</span><button id="viewModeBtn">🎮 開啟自由視角控制</button><p id="viewModeHelp" style="margin-top:8px">開啟後：左鍵旋轉、右鍵平移、滾輪縮放。</p></section>
    <section class="group"><span class="label">角色控制</span><select id="characterTarget"><option value="primary">第一角色</option><option value="secondary">第二角色</option></select><button id="characterModeBtn" style="margin-top:8px">🧍 開啟角色控制模式</button><p id="characterModeHelp" style="margin-top:8px">開啟後：左鍵旋轉角色、右鍵拖曳移動角色、滾輪縮放角色。</p></section>
    <section class="group"><div id="info">等待載入 FBX 檔案。</div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="importmap">

      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    } }
  </script>
  <script type="module">

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    const $ = id => document.getElementById(id), clock = new THREE.Clock();

    const hemi = new THREE.HemisphereLight(0xbfdcff, 0x30251d, 2.1); scene.add(hemi); const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(4, 7, 4); sun.castShadow = true; scene.add(sun);
    const grid = new THREE.GridHelper(20, 20, 0x64748b, 0x334155); scene.add(grid); const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: .22 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

    function setInfo(text) { $('info').textContent = text; }
    function applyBackground() { const type = $('background').value, color = new THREE.Color($('bgColor').value); renderer.setClearAlpha(type === 'transparent' ? 0 : 1); if (type === 'transparent') scene.background = null; else if (type === 'solid') scene.background = color; else if (type === 'sky') scene.background = new THREE.Color(0x74b9ff); else { scene.background = color; } hemi.intensity = type === 'sky' ? 2.8 : 2.1; }
    function modelFrame() { if (!model) return null; const box = new THREE.Box3().setFromObject(model); if (secondaryModel) box.union(new THREE.Box3().setFromObject(secondaryModel)); const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3()); const distance = Math.max(size.x, size.y, size.z) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) || 1) * 1.45; return { center, distance }; }

    function chooseSecondaryClip(index, restart = true) { if (!secondaryMixer || !secondaryClips.length) return; if (secondaryAction) secondaryAction.fadeOut(.15); secondaryAction = secondaryMixer.clipAction(secondaryClips[index]); secondaryAction.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(.15).play(); if (!restart) secondaryAction.paused = true; }
    function configureSecondaryClips() { const select = $('secondaryClipSelect'); select.innerHTML = ''; secondaryClips.forEach((clip, i) => select.add(new Option(`${i + 1}. ${clip.name || '未命名動畫'} (${clip.duration.toFixed(2)} 秒)`, i))); const active = secondaryClips.length > 0; select.disabled = !active; ['secondaryPlayBtn','secondaryPauseBtn','secondaryResetBtn'].forEach(id => $(id).disabled = !active); if (active) chooseSecondaryClip(0); else select.innerHTML = '<option>尚未載入第二角色動畫</option>'; }
    function playSequenceClip(index) { if (!mixer || !clips.length) return; sequenceIndex = index; if (currentAction) currentAction.stop(); currentAction = mixer.clipAction(clips[index]); currentAction.reset().setLoop(THREE.LoopOnce, 1).clampWhenFinished = true; currentAction.play(); $('clipSelect').value = index; }
    function toggleSequence() { if (!clips.length) return; if (sequencePlaying) { sequencePlaying = false; $('sequenceBtn').textContent = '▶ 全部動作'; return; } sequencePlaying = true; $('sequenceBtn').textContent = '■ 停止輪播'; playSequenceClip(+$('clipSelect').value || 0); }
    function showAnimationNames() { const panel = $('namesPanel'); panel.hidden = !panel.hidden; if (!panel.hidden) { $('namesLabel').textContent = '可自行反白並複製'; $('animationNames').value = clips.map((clip, i) => `${i + 1}. ${clip.name || `未命名動畫_${i + 1}`}`).join('\n'); } $('copyNamesBtn').textContent = panel.hidden ? '☰ 顯示動作標籤' : '▴ 收起動作標籤'; }
    function showAnimationSnippet() { const safeName = (clip, i) => (clip.name || `未命名動畫_${i + 1}`).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); $('animationNames').value = `animation: [\n${clips.map((clip, i) => `  '${safeName(clip, i)}', // ${i + 1}`).join('\n')}\n],`; $('namesLabel').textContent = '動畫設定片段：可自行反白並複製'; $('namesPanel').hidden = false; $('copyNamesBtn').textContent = '☰ 顯示動作標籤'; }

    function resetSearch() { $('searchResults').disabled = true; $('searchResults').innerHTML = '<option>尚未搜尋</option>'; $('searchStatus').textContent = ''; }
    function searchAssets() { const query = $('searchQuery').value.trim().toLocaleLowerCase(); if (!query) { $('searchStatus').textContent = '請輸入關鍵字。'; return; } const results = $('searchResults'); results.innerHTML = ''; const models = modelFiles.map((file, index) => ({ file, index })).filter(({ file }) => `${file.name} ${file.webkitRelativePath || ''}`.toLocaleLowerCase().includes(query)); const actions = clips.map((clip, index) => ({ clip, index })).filter(({ clip }) => (clip.name || '').toLocaleLowerCase().includes(query)); models.forEach(({ file, index }) => results.add(new Option(`模型：${file.webkitRelativePath || file.name}`, `model:${index}`))); actions.forEach(({ clip, index }) => results.add(new Option(`動作：${index + 1}. ${clip.name || '未命名動畫'}（目前模型）`, `action:${index}`))); const total = models.length + actions.length; results.disabled = !total; if (!total) results.add(new Option('找不到符合項目', '')); $('searchStatus').textContent = `找到 ${models.length} 個模型、${actions.length} 個目前模型動作。`; }
    function autoApplyKnownTextures(root, files) {
      const rules = [
        ['dull blade', 'equip_sword_blunt_01_tex_diffuse.png'], ['cool steel', 'equip_sword_steel_01_tex_diffuse.png'],
        ["lion's roar", 'equip_sword_rockkiller_01_tex_diffuse.png'], ['bakufu', 'equip_sword_bakufu_02_tex_diffuse.png'],
        ['boreas', 'equip_sword_boreas_01_tex_diffuse.png'], ['narukami', 'equip_sword_narukami_01_tex_diffuse.png'],
        ['prototype rancour', 'equip_sword_proto_01_tex_diffuse.png'], ['freedom-sworn', 'equip_sword_widsith_01_tex_diffuse.png'],
        ['katana', 'skillobj_shougun.png']

    function loadModelAt(index) { if (!modelFiles.length) return; modelIndex = (index + modelFiles.length) % modelFiles.length; disposeAssets(); const file = modelFiles[modelIndex]; const name = file.name.toLowerCase(); refreshModelNav(); if (name.endsWith('.glb')) loadGLB(file); else loadFBX(file, assetsForFolder(file)); }
    function loadSecondaryAt(index) { if (index === '' || index === undefined) { clearSecondary(); frameModel(); return; } const file = modelFiles[+index]; if (!file) return; clearSecondary(); secondaryIndex = +index; const name = file.name.toLowerCase(), assets = assetsForFolder(file, secondaryAssetUrls); const reader = new FileReader(); reader.onload = e => { try { if (name.endsWith('.glb')) { new GLTFLoader().parse(e.target.result, '', gltf => finishSecondary(gltf.scene, gltf.animations, file.webkitRelativePath || file.name), () => setInfo('第二 GLB 載入失敗。')); } else { const manager = new THREE.LoadingManager(); manager.setURLModifier(url => { const raw = decodeURIComponent(url).toLowerCase(); const clean = raw.slice(Math.max(raw.lastIndexOf('/'), raw.lastIndexOf('\\')) + 1); return assets.get(clean) || assets.get(raw) || url; }); const root = new FBXLoader(manager).parse(e.target.result, ''); autoApplyKnownTextures(root, assets); finishSecondary(root, root.animations, file.webkitRelativePath || file.name); } } catch (err) { console.error(err); setInfo('第二模型載入失敗。'); } }; reader.readAsArrayBuffer(file); }
    function loadFile(file) { const name = file.name.toLowerCase(); if (name.endsWith('.zip')) loadZip(file); else if (name.endsWith('.glb')) loadGLB(file); else loadFBX(file); }
    $('panelToggle').onclick = () => { const closed = document.body.classList.toggle('panel-collapsed'); $('panelToggle').textContent = closed ? '❯' : '❮'; $('panelToggle').setAttribute('aria-label', closed ? '展開側邊欄' : '收納側邊欄'); $('panelToggle').title = closed ? '展開側邊欄' : '收納側邊欄'; }; $('folderBtn').onclick = () => $('folderInput').click(); $('fileBtn').onclick = () => $('fileInput').click(); $('folderInput').addEventListener('change', e => { clearSecondary(); folderFiles = [...e.target.files]; modelFiles = folderFiles.filter(file => /\.(fbx|glb)$/i.test(file.name)).sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, 'zh-Hant')); $('sourceStatus').textContent = folderFiles.length ? `已選擇資料夾：${folderFiles[0].webkitRelativePath.split('/')[0]}\n掃描到 ${modelFiles.length} 個模型。` : '尚未選擇來源。'; resetSearch(); if (!modelFiles.length) { modelIndex = -1; refreshModelNav(); setInfo('此資料夾及子資料夾內找不到 .fbx 或 .glb。'); return; } loadModelAt(0); }); $('fileInput').addEventListener('change', e => { if (!e.target.files[0]) return; clearSecondary(); $('sourceStatus').textContent = `已選擇檔案：${e.target.files[0].name}`; resetSearch(); loadFile(e.target.files[0]); }); $('modelSelect').addEventListener('change', e => loadModelAt(+e.target.value)); $('secondModelSelect').addEventListener('change', e => loadSecondaryAt(e.target.value)); $('clearSecondBtn').onclick = () => { clearSecondary(); frameModel(); }; $('clipSelect').addEventListener('change', e => chooseClip(+e.target.value)); $('searchBtn').onclick = searchAssets; $('searchQuery').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); searchAssets(); } }); $('searchResults').addEventListener('change', e => { const [type, raw] = e.target.value.split(':'); const index = +raw; if (type === 'model') loadModelAt(index); if (type === 'action') { $('clipSelect').value = index; chooseClip(index); } });
    $('playBtn').onclick = () => { if (currentAction) { sequencePlaying = false; $('sequenceBtn').textContent = '▶ 全部動作'; currentAction.paused = false; currentAction.play(); } }; $('pauseBtn').onclick = () => { if (currentAction) currentAction.paused = true; }; $('resetBtn').onclick = () => chooseClip(+$('clipSelect').value); $('sequenceBtn').onclick = toggleSequence; $('copyNamesBtn').onclick = showAnimationNames; $('snippetBtn').onclick = showAnimationSnippet; $('speed').oninput = e => { const v = +e.target.value; if (mixer) mixer.timeScale = v; $('speedValue').textContent = `${v.toFixed(1)}×`; };
    $('secondaryClipSelect').addEventListener('change', e => chooseSecondaryClip(+e.target.value)); $('secondaryPlayBtn').onclick = () => { if (secondaryAction) { secondaryAction.paused = false; secondaryAction.play(); } }; $('secondaryPauseBtn').onclick = () => { if (secondaryAction) secondaryAction.paused = true; }; $('secondaryResetBtn').onclick = () => chooseSecondaryClip(+$('secondaryClipSelect').value);
    $('background').onchange = applyBackground; $('bgColor').oninput = applyBackground; $('gridBtn').onclick = () => { gridVisible = !gridVisible; grid.visible = floor.visible = gridVisible; $('gridBtn').textContent = gridVisible ? '隱藏地面網格' : '顯示地面網格'; }; $('frameBtn').onclick = frameModel;
    function activeCharacter() { return $('characterTarget').value === 'secondary' && secondaryModel ? secondaryModel : model; }
    function setCharacterMode(enabled) { characterMode = enabled; characterDrag = null; if (enabled) { controls.enabled = false; $('viewModeBtn').textContent = '🎮 開啟自由視角控制'; $('viewModeHelp').textContent = '控制已關閉，避免與角色控制衝突。'; } $('characterModeBtn').textContent = enabled ? '🔒 關閉角色控制模式' : '🧍 開啟角色控制模式'; $('characterModeHelp').textContent = enabled ? '角色控制已開啟：左鍵旋轉、右鍵拖曳移動、滾輪縮放。' : '開啟後：左鍵旋轉角色、右鍵拖曳移動角色、滾輪縮放角色。'; renderer.domElement.style.cursor = enabled ? 'move' : controls.enabled ? 'grab' : 'default'; }
    $('viewModeBtn').onclick = () => { if (characterMode) setCharacterMode(false); controls.enabled = !controls.enabled; $('viewModeBtn').textContent = controls.enabled ? '🔒 關閉自由視角控制' : '🎮 開啟自由視角控制'; $('viewModeHelp').textContent = controls.enabled ? '控制已開啟：左鍵旋轉、右鍵平移、滾輪縮放。' : '控制已關閉，避免誤觸鏡頭。'; renderer.domElement.style.cursor = controls.enabled ? 'grab' : 'default'; };
    $('characterModeBtn').onclick = () => setCharacterMode(!characterMode); renderer.domElement.addEventListener('pointerdown', event => { if (!characterMode || !activeCharacter() || ![0, 2].includes(event.button)) return; event.preventDefault(); characterDrag = { button: event.button, x: event.clientX, y: event.clientY }; }); renderer.domElement.addEventListener('pointermove', event => { if (!characterMode || !characterDrag) return; const target = activeCharacter(); if (!target) return; const dx = event.clientX - characterDrag.x, dy = event.clientY - characterDrag.y; characterDrag.x = event.clientX; characterDrag.y = event.clientY; if (characterDrag.button === 0) { target.rotation.y += dx * .01; target.rotation.x = THREE.MathUtils.clamp(target.rotation.x + dy * .005, -Math.PI / 2, Math.PI / 2); } else { const step = (modelFrame()?.distance || 1) * .0015; const forward = camera.getWorldDirection(new THREE.Vector3()); forward.y = 0; forward.normalize(); const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize(); target.position.addScaledVector(right, dx * step).addScaledVector(forward, -dy * step); } }); addEventListener('pointerup', () => characterDrag = null); renderer.domElement.addEventListener('wheel', event => { if (!characterMode || !activeCharacter()) return; event.preventDefault(); const target = activeCharacter(), factor = Math.exp(-event.deltaY * .001), next = THREE.MathUtils.clamp(target.scale.x * factor, .05, 50); target.scale.multiplyScalar(next / target.scale.x); }, { passive: false });
    const drop = $('dropZone'); ['dragenter','dragover'].forEach(type => addEventListener(type, e => { e.preventDefault(); drop.classList.add('show'); })); ['dragleave','drop'].forEach(type => addEventListener(type, e => { e.preventDefault(); drop.classList.remove('show'); })); addEventListener('drop', e => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));
    addEventListener('keydown', e => { if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowUp') { e.preventDefault(); loadModelAt(modelIndex - 1); } else if (e.key === 'ArrowDown') { e.preventDefault(); loadModelAt(modelIndex + 1); } else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && clips.length) { e.preventDefault(); const next = (+$('clipSelect').value + (e.key === 'ArrowLeft' ? -1 : 1) + clips.length) % clips.length; $('clipSelect').value = next; chooseClip(next); } });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }); applyBackground();
    renderer.setAnimationLoop(() => { const delta = clock.getDelta(); if (mixer) mixer.update(delta); if (secondaryMixer) secondaryMixer.update(delta); controls.update(); renderer.render(scene, camera); });
    function onSequenceFinished() { if (!sequencePlaying) return; if (sequenceIndex + 1 < clips.length) playSequenceClip(sequenceIndex + 1); else { sequencePlaying = false; $('sequenceBtn').textContent = '▶ 全部動作'; } }
  </script>
