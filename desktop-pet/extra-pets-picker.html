<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>額外寵物</title>
<style>
  :root { --cyan: #00d4ff; --bg: #14181f; --border: rgba(255,255,255,0.12); --text: #eee; --text2: #9aa4b2; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  #hint {
    padding: 10px 14px 4px; font-size: .82em; color: var(--text2);
  }
  #list {
    flex: 1; overflow-y: auto; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 6px; cursor: pointer; user-select: none;
  }
  .item:hover { background: rgba(255,255,255,0.06); }
  .item input { width: 16px; height: 16px; accent-color: var(--cyan); cursor: pointer; }
  .item span { flex: 1; }
  #actions {
    display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border);
  }
  button {
    flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text); font-size: .88em; cursor: pointer;
  }
  button:hover { border-color: var(--cyan); }
  #btn-apply { background: var(--cyan); color: #06222b; border-color: var(--cyan); font-weight: 700; }
  #btn-apply:disabled { background: rgba(255,255,255,0.06); color: var(--text2); border-color: var(--border); cursor: default; }
</style>
</head>
<body>
  <div id="hint">勾選想呈現的額外寵物（可複選），按「確定套用」才會真的新增/移除，關掉這個視窗不會遺失勾選。</div>
  <div id="list"></div>
  <div id="actions">
    <button id="btn-clear">全部取消勾選</button>
    <button id="btn-apply">確定套用</button>
  </div>

<script>
  const listEl = document.getElementById('list');
  const applyBtn = document.getElementById('btn-apply');
  const clearBtn = document.getElementById('btn-clear');
  let checkedIds = new Set();
  let initialChecked = new Set();

  function render(candidates) {
    listEl.innerHTML = '';
    candidates.forEach(({ id, label }) => {
      const row = document.createElement('label');
      row.className = 'item';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = checkedIds.has(id);
      box.addEventListener('change', () => {
        if (box.checked) checkedIds.add(id); else checkedIds.delete(id);
        updateApplyState();
      });
      const span = document.createElement('span');
      span.textContent = label;
      row.appendChild(box);
      row.appendChild(span);
      listEl.appendChild(row);
    });
  }

  function updateApplyState() {
    const same = checkedIds.size === initialChecked.size &&
      [...checkedIds].every((id) => initialChecked.has(id));
    applyBtn.disabled = same;
  }

  window.extraPetsPicker.onInit(({ candidates, checked }) => {
    checkedIds = new Set(checked);
    initialChecked = new Set(checked);
    render(candidates);
    updateApplyState();
  });

  clearBtn.addEventListener('click', () => {
    checkedIds.clear();
    document.querySelectorAll('#list input[type=checkbox]').forEach((el) => { el.checked = false; });
    updateApplyState();
  });

  applyBtn.addEventListener('click', () => {
    window.extraPetsPicker.apply([...checkedIds]);
  });
</script>
</body>
</html>
