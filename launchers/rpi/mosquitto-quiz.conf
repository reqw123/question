# ─────────────────────────────────────────────────────────────────────────────
# 多人搶答系統需要的 Mosquitto 設定（Raspberry Pi）
#
# 安裝：
#   sudo apt install -y mosquitto
#   sudo cp launchers/rpi/mosquitto-quiz.conf /etc/mosquitto/conf.d/quiz.conf
#   sudo systemctl enable --now mosquitto
#   sudo systemctl restart mosquitto
#
# 驗證：
#   ss -ltn | grep -E '1883|9001'      # 兩個埠都要有人在聽
#
# multi/multiplay.js 的瀏覽器端走 MQTT over WebSocket，純區網（http:）情境下
# 直接連 ws://<pi-ip>:9001，不經任何反向代理。
# ─────────────────────────────────────────────────────────────────────────────

# 原生 MQTT（給 ESP32 音效板、Node-RED 等非瀏覽器用戶端；瀏覽器用不到）
listener 1883
protocol mqtt

# MQTT over WebSocket（瀏覽器端 host.html / player.html 走這個）
listener 9001
protocol websockets

# 純區網、封閉環境：不設帳密。
# ⚠ 若這台 Pi 會曝露到不信任的網路（例如接了 ngrok / port forwarding），
#   請改成 allow_anonymous false 並設定 password_file 與 acl_file。
allow_anonymous true
